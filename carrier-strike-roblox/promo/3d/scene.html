<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}#t{position:absolute;inset:0;pointer-events:none;font-family:'Russo One',Impact,sans-serif}
.h{position:absolute;color:#fff;-webkit-text-stroke:0;paint-order:stroke;text-shadow:0 6px 0 #0a0f1a,0 0 24px rgba(0,0,0,.55)}
.g{background:linear-gradient(#fff3b8,#ffb22e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #0a0f1a) drop-shadow(0 0 14px rgba(0,0,0,.6))}
.b{background:linear-gradient(#ffffff,#d8f1ff 55%,#5cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #0a0f1a) drop-shadow(0 0 14px rgba(0,0,0,.6))}
</style></head><body><div id="t"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const Q=new URLSearchParams(location.search),MODE=Q.get('m')||'icon';
const W=MODE==='icon'?512:1920,H=MODE==='icon'?512:1080;
const V=THREE.Vector3;const col=h=>new THREE.Color(h).convertSRGBToLinear();
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(2);R.setSize(W,H);R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=0.85;
document.body.prepend(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(MODE==='icon'?38:32,W/H,0.5,60000);

// ---------- небо (закат) и солнце
const SUN=(MODE==='icon'?new V(-0.38,0.085,-0.92):MODE==='t1'?new V(-0.75,0.085,-0.65):new V(0.55,0.08,-0.83)).normalize();
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{sun:{value:SUN}},
 vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform vec3 sun;varying vec3 vD;void main(){vec3 d=normalize(vD);float h=max(d.y,0.);
  vec3 hz=vec3(1.0,.55,.28),mid=vec3(.72,.33,.42),zn=vec3(.10,.12,.30);
  vec3 c=mix(hz,mid,smoothstep(0.,.18,h));c=mix(c,zn,smoothstep(.15,.6,h));
  float s=max(dot(d,sun),0.);c*=.85;c+=vec3(1.,.7,.4)*pow(s,8.)*.35+vec3(1.,.85,.6)*pow(s,120.)*.8+vec3(1.,.95,.85)*smoothstep(.9994,.9997,s)*4.;
  if(d.y<0.)c=mix(hz*.6,vec3(.05,.07,.12),smoothstep(0.,-.2,d.y));
  gl_FragColor=vec4(c,1.);}`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(40000,48,24),skyMat);scene.add(sky);

// ---------- океан
const sea=new THREE.Mesh(new THREE.PlaneGeometry(120000,120000,1,1),new THREE.ShaderMaterial({uniforms:{sun:{value:SUN},cp:{value:new V()}},
 vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
 fragmentShader:`uniform vec3 sun,cp;varying vec3 vW;
  float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float ns(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),u.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),u.x),u.y);}
  float fb(vec2 p){float a=0.,m=.5;mat2 r=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<4;i++){a+=m*ns(p);p=r*p;m*=.5;}return a;}
  void main(){vec2 p=vW.xz*.045;float dist0=length(cp-vW);
   float e=.08;float h0=fb(p),hx=fb(p+vec2(e,0.)),hz=fb(p+vec2(0.,e));
   float k=(.55*exp(-dist0*.0016)+.06);
   vec3 nr=normalize(vec3(-(hx-h0)/e*k,1.,-(hz-h0)/e*k));
   vec3 v=normalize(cp-vW);vec3 r=reflect(-v,nr);
   float fr=.02+.98*pow(1.-max(dot(nr,v),0.),5.);
   float h=max(r.y,0.);vec3 skyc=mix(vec3(1.,.55,.28),vec3(.72,.33,.42),smoothstep(0.,.18,h));skyc=mix(skyc,vec3(.1,.12,.3),smoothstep(.15,.6,h));
   vec3 deep=vec3(.03,.09,.15);vec3 c=mix(deep,skyc,fr);
   float s=max(dot(r,sun),0.);c+=vec3(1.,.8,.55)*pow(s,160.)*1.6+vec3(1.,.6,.35)*pow(s,40.)*.18;
   float dist=length(cp-vW);c=mix(c,vec3(1.,.58,.34)*.85,smoothstep(6000.,40000.,dist)*.6);
   gl_FragColor=vec4(c,1.);}`}));
sea.rotation.x=-Math.PI/2;scene.add(sea);

// ---------- свет и отражения
const sunL=new THREE.DirectionalLight(0xffc89a,2.3);sunL.position.copy(SUN).multiplyScalar(1000);scene.add(sunL);
scene.add(new THREE.HemisphereLight(0x9a8fc0,0x2a1a20,0.9));
const rim=new THREE.DirectionalLight(0xb8c8ff,1.3);rim.position.set(1,0.8,1.2);scene.add(rim);const key=new THREE.DirectionalLight(0xffe0c0,0.6);key.position.set(0.3,0.5,1);scene.add(key);
scene.add(new THREE.AmbientLight(0x9088a8,0.55));

// ---------- авианосец (из примитивов)
function carrier(x,z,rot,s){const g=new THREE.Group();const m=c=>new THREE.MeshStandardMaterial({color:col(c),roughness:.8,metalness:.2});
 const hull=new THREE.Mesh(new THREE.BoxGeometry(60,22,320),m(0x1c2028));hull.position.y=11;g.add(hull);
 const bow=new THREE.Mesh(new THREE.CylinderGeometry(0.1,30,60,4,1),m(0x1c2028));bow.rotation.x=-Math.PI/2;bow.rotation.y=Math.PI/4;bow.scale.set(1,1,.5);bow.position.set(0,11,-185);g.add(bow);
 const deck=new THREE.Mesh(new THREE.BoxGeometry(78,2.5,330),m(0x2a2d33));deck.position.y=23;g.add(deck);
 const isl=new THREE.Mesh(new THREE.BoxGeometry(12,26,40),m(0x30353d));isl.position.set(30,37,20);g.add(isl);
 const mast=new THREE.Mesh(new THREE.BoxGeometry(2,18,2),m(0x30353d));mast.position.set(30,58,20);g.add(mast);
 for(let i=0;i<4;i++){const j=jetCache.f16?null:null;}
 const wake=new THREE.Mesh(new THREE.PlaneGeometry(70,900),new THREE.MeshBasicMaterial({color:col(0xffe2c8),transparent:true,opacity:.28,depthWrite:false}));wake.rotation.x=-Math.PI/2;wake.position.set(0,0.3,600);g.add(wake);
 g.position.set(x,0,z);g.rotation.y=rot;g.scale.setScalar(s||1);scene.add(g);return g;}
const jetCache={};const camLook=new V();const ALT=MODE==='t2'?0:90;

// ---------- остров
function island(x,z,r,seed){const N=180,geo=new THREE.PlaneGeometry(r*2.6,r*2.6,N,N);geo.rotateX(-Math.PI/2);
 const pos=geo.attributes.position,cols=[];const hs=(a,b)=>{const v=Math.sin(a*12.9898+b*78.233+seed)*43758.5453;return v-Math.floor(v);};
 const ns=(px,pz)=>{const ix=Math.floor(px),iz=Math.floor(pz),fx=px-ix,fz=pz-iz,ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);
  return (hs(ix,iz)*(1-ux)+hs(ix+1,iz)*ux)*(1-uz)+(hs(ix,iz+1)*(1-ux)+hs(ix+1,iz+1)*ux)*uz;};
 const fbm=(px,pz)=>{let a=0,m=.5;for(let i=0;i<5;i++){a+=m*ns(px,pz);px=px*2.03+11;pz=pz*2.03+7;m*=.5;}return a;};
 const sand=col(0xc9b383),grass=col(0x3f6a33),dark=col(0x2a4a24),rock=col(0x7a746a),c=new THREE.Color();
 for(let i=0;i<pos.count;i++){const px=pos.getX(i),pz=pos.getZ(i);const d=Math.hypot(px,pz)/r;
  const n=fbm(px/r*2.2,pz/r*2.2);const fall=Math.max(0,1-Math.pow(d*(0.85+0.3*n),2.2));
  let h=fall*(18+90*Math.pow(n,2.2))*(1-Math.exp(-fall*6))-4+fall*6;
  const rw=false;
  pos.setY(i,h);
  if(h<3.5)c.copy(sand);else if(rw&&h>6)c.copy(col(0x26282d));else if(h>55)c.copy(rock).lerp(grass,.2);else c.copy(grass).lerp(dark,ns(px*.05,pz*.05));
  cols.push(c.r,c.g,c.b);}
 geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));geo.computeVertexNormals();
 const g=new THREE.Group();g.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})));
 const shal=new THREE.Mesh(new THREE.CircleGeometry(r*1.25,64),new THREE.MeshBasicMaterial({color:col(0x3aa0a8),transparent:true,opacity:.35,depthWrite:false}));shal.rotation.x=-Math.PI/2;shal.position.y=.15;g.add(shal);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,46),new THREE.MeshStandardMaterial({color:col(0xdddddd)}));pole.position.set(-r*.3,33,-r*.15);g.add(pole);
 const flag=new THREE.Mesh(new THREE.PlaneGeometry(20,12),new THREE.MeshBasicMaterial({color:col(0x5cc8ff),side:THREE.DoubleSide}));flag.position.set(-r*.3+10,50,-r*.15);g.add(flag);
 g.position.set(x,0,z);scene.add(g);return g;}

// ---------- свечения (форсаж, вспышки)
function glowTex(c1,c2){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,c1);gr.addColorStop(.35,c2);gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);return t;}
const abTex=glowTex('rgba(255,250,220,1)','rgba(255,140,40,.8)'),smokeTex=glowTex('rgba(255,255,255,.9)','rgba(230,225,235,.5)');
function sprite(tex,pos,size,op,add){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:op,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending}));s.position.copy(pos);s.scale.setScalar(size);scene.add(s);return s;}

// ---------- самолёты
const FWD={f16:'+z',fa18:'+x',su33:'+x',rafale:'-x'};
function loadJet(nm){return new Promise(res=>new THREE.GLTFLoader().load('real/'+nm+'.glb',g=>{
 const o=g.scene;o.traverse(m=>{if(m.isMesh){m.castShadow=true;if(m.material){const mm=Array.isArray(m.material)?m.material:[m.material];mm.forEach(q=>{q.envMapIntensity=1.0;if(q.metalness!==undefined){q.metalness=Math.min(q.metalness,0.35);q.roughness=Math.max(q.roughness,0.38);}q.needsUpdate=true;});}if(/landing|LG|wheel/i.test(m.name))m.visible=true;}});
 const holder=new THREE.Group();holder.add(o);
 o.rotation.y=FWD[nm]==='+x'?Math.PI/2:FWD[nm]==='-x'?-Math.PI/2:Math.PI; // нос → −Z
 o.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(o);const sz=b.getSize(new V());const s=16/sz.z;o.scale.multiplyScalar(s);
 o.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(o);const c=b2.getCenter(new V());o.position.sub(c);
 holder.userData.len=b2.getSize(new V()).z;res(holder);}));}
function place(j,pos,yaw,pitch,roll,ab){j.position.copy(pos);j.position.y+=ALT;j.rotation.set(0,0,0);j.rotateY(yaw);j.rotateX(pitch);j.rotateZ(roll);scene.add(j);
 if(ab){j.updateMatrixWorld(true);const tail=new V(0,0.1,j.userData.len*.5+0.6).applyMatrix4(j.matrixWorld);sprite(abTex,tail,Math.min(ab,3.2),0.9,true);
  const tail2=new V(0,0.1,j.userData.len*.5+2.2).applyMatrix4(j.matrixWorld);sprite(abTex,tail2,Math.min(ab,3.2)*1.5,.3,true);}
 return j;}
function smokeTrail(pts,size){pts=pts.map(p=>p.clone().add(new V(0,ALT,0)));const curve=new THREE.CatmullRomCurve3(pts);const N=160;for(let i=0;i<N;i++){const t=i/(N-1);sprite(smokeTex,curve.getPoint(t),size*(1.6-t*0.9),0.05+0.35*t,false);}
 sprite(abTex,curve.getPoint(1),size*1.4,1,true);}

function svgText(lines){let o=`<svg width="${W}" height="${H}" style="position:absolute;inset:0"><defs>
<linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#dff3ff"/><stop offset="1" stop-color="#5cc8ff"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset="1" stop-color="#ffb22e"/></linearGradient></defs><g font-family="'Russo One',Impact,sans-serif">`;
 for(const l of lines){const a=l.mid?'text-anchor="middle"':'';o+=`<text x="${l.x}" y="${l.y}" font-size="${l.s}" ${a} fill="#0a0f1a" stroke="#0a0f1a" stroke-width="${l.s*.22}" stroke-linejoin="round">${l.t}</text><text x="${l.x}" y="${l.y}" font-size="${l.s}" ${a} fill="${l.f}">${l.t}</text>`;}
 document.getElementById('t').innerHTML=o+'</g></svg>';}
function txt(){}

(async()=>{
 const want=MODE==='icon'?['fa18','su33']:MODE==='t1'?['su33','fa18']:['rafale','fa18'];
 const J={};for(const n of want)J[n]=await loadJet(n);
 if(MODE==='icon'){
  carrier(-260,-2600,0.9,1);
  place(J.fa18,new V(0,0,0),2.45,0.16,0.55,6);
  place(J.su33,new V(-45,22,-140),2.0,0.08,0.45,4);
  cam.position.set(6,4,30);camLook.set(-1,-1.5,0);cam.lookAt(-1,-1.5,0);
  svgText([{t:'CARRIER',x:256,y:432,s:74,f:'url(#tb)',mid:1},{t:'STRIKE',x:256,y:496,s:62,f:'url(#tg)',mid:1}]);
 }else if(MODE==='t1'){
  carrier(-900,-3400,0.7,1);
  place(J.su33,new V(6,0,0),0.55,0.14,0.75,7);
  place(J.fa18,new V(-46,9,-52),0.45,0.06,0.45,6);
  smokeTrail([new V(-42,7.5,-46),new V(-30,6,-32),new V(-16,3.5,-16),new V(-4,1.5,-4)],1.6);
  cam.position.set(24,3,30);camLook.set(-14,2,-16);cam.lookAt(-14,2,-16);
  svgText([{t:'DOGFIGHT!',x:80,y:165,s:120,f:'url(#tg)'},{t:'BLUE vs RED · 6 JETS',x:86,y:240,s:52,f:'#fff'}]);
 }else{
  carrier(1400,-3800,-0.6,1);
  island(30,-520,260,1.3);island(1000,-2300,320,4.7);
  place(J.rafale,new V(-142,111.5,19),-1.25,-0.06,-0.5,5);
  place(J.fa18,new V(-93,114,-43),-0.93,-0.04,-0.45,5);
  cam.position.set(-160,120,60);camLook.set(0,60,-400);cam.lookAt(0,60,-400);
  svgText([{t:'CAPTURE ISLANDS',x:80,y:160,s:110,f:'url(#tb)'},{t:'TAKE OFF FROM YOUR CARRIER',x:86,y:235,s:52,f:'#fff'}]);
 }
 cam.position.y+=ALT;{const d=new V();cam.getWorldDirection(d);}cam.lookAt(camLook.x,camLook.y+ALT,camLook.z);
 sea.material.uniforms.cp.value.copy(cam.position);sky.position.copy(cam.position);
 cam.updateMatrixWorld();
 const rt=new THREE.WebGLMultisampleRenderTarget(W*2,H*2,{type:THREE.HalfFloatType,format:THREE.RGBAFormat});rt.samples=4;
 const comp=new THREE.EffectComposer(R,rt);comp.setPixelRatio(2);comp.setSize(W,H);comp.addPass(new THREE.RenderPass(scene,cam));
 comp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(W,H),0.45,0.45,1.6));
 comp.render();
 await document.fonts.ready;document.body.setAttribute('data-ready','1');
})();
</script></body></html>
