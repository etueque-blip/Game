<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-screen 3D view, HUD overlay, side-select and hangar screens on top */
:root{--bg:#0a1510;--panel:#0b1c14ee;--line:#2f7a4e;--green:#6cff8c;--green2:#3fb865;--yellow:#ffc94a;--blue:#4f8fd6;--red:#e0584c;--ink:#e6fff0;--dim:#8fb8a0;--orange:#ff7a3c;
--ui:'Montserrat',system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;color-scheme:dark}
html{font-size:clamp(9px,min(1.2vw,2.2vh),17px);background:var(--bg)}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.scr{position:absolute;inset:0;padding:max(1rem,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.btn{background:#0c2218;border:2px solid var(--line);border-radius:.8rem;padding:.7rem 1rem;font-weight:800;letter-spacing:.03em;color:var(--green)}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:#1b1500}
.btn.g{background:var(--green);border-color:var(--green);color:#052010}
.btn.d{opacity:.45}
/* side select */
#sideScr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:linear-gradient(#0a1a2a99,#0a1a2acc)}
#sideScr h1{margin:0;font-weight:500;color:var(--green);font-size:2rem}
.teams{display:flex;gap:2rem;width:min(100%,68rem)}
.team{flex:1;min-width:0;background:#0b1c14;border:3px solid;border-radius:1.6rem;overflow:hidden;display:flex;flex-direction:column}
.team.blue{border-color:var(--blue)}.team.red{border-color:var(--red)}
.team header{padding:1rem 1.4rem}
.team.blue header{background:var(--blue)}.team.red header{background:var(--red)}
.team header b{font-size:2.4rem;font-weight:500;display:block}
.team header small{font-weight:800;font-size:1.05rem}
.plist{padding:.8rem 1.4rem;display:flex;flex-direction:column;gap:.5rem;min-height:13rem}
.prow{display:grid;grid-template-columns:3.4rem 1fr 6.5rem 4rem;align-items:center;gap:.8rem;font-weight:800;color:var(--green);font-size:1.5rem}
.prow i{width:3rem;height:3rem;border-radius:50%;border:2px solid var(--green2);background:#1d3a2b;display:grid;place-items:center;font-style:normal;font-size:1.2rem;color:var(--ink)}
.prow span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow em{font-style:normal;text-align:right;font-family:var(--mono)}
.team .join{margin:.4rem 1.4rem 1.4rem;border-radius:1rem;padding:1.1rem;font-size:1.7rem;font-weight:500;color:#fff}
.team.blue .join{background:#5aa0ff}.team.red .join{background:#ff5f50}
.row{display:flex;gap:1rem;width:min(100%,68rem)}
.row .btn{font-size:1.6rem;padding:1rem 2rem}
/* hangar */
#hangar{display:grid;grid-template-columns:23rem 1fr 25rem;grid-template-rows:1fr auto;gap:1rem;pointer-events:none}
#hangar>*{pointer-events:auto}
.pan{background:var(--panel);border:2px solid var(--line);border-radius:1.2rem;padding:.9rem;display:flex;flex-direction:column;gap:.6rem;min-height:0}
.tabs{display:flex;gap:.5rem}.tabs .btn{flex:1;font-size:1.3rem;padding:.7rem}
.btn.on{background:var(--green);color:#052010;border-color:var(--green)}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}.chips .btn{padding:.35rem .6rem;font-size:.85rem;border-radius:.6rem}
#vlist{overflow:auto;display:flex;flex-direction:column;gap:.4rem;flex:1;min-height:6rem}
.veh{background:#0a1a12;border:2px solid #1a3a29;border-radius:.8rem;padding:.55rem .8rem;text-align:left}
.veh b{display:block;font-size:1.2rem;color:var(--yellow)}.veh small{color:var(--dim);font-weight:700;font-size:.9rem}
.veh.sel{background:#1d5a33;border-color:var(--green2)}.veh.sel b{color:var(--ink)}.veh.own b{color:var(--green)}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.menu2 .btn{font-size:1rem;padding:.6rem .3rem}
#hmid{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;pointer-events:none}
#pcard{pointer-events:auto;width:min(26rem,100%);background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:.7rem 1rem;font-weight:800}
#pcard .bar,.sbar{height:.5rem;background:#11261b;border-radius:.3rem;overflow:hidden;margin-top:.4rem}
#pcard .bar i{display:block;height:100%;background:var(--yellow)}
#vname{margin:0;color:var(--green);font-size:2rem}
.sub{font-weight:800;letter-spacing:.03em;font-size:1.2rem}
.chip{display:inline-block;border:2px solid #4a3a1a;border-radius:.8rem;color:var(--yellow);padding:.4rem .8rem;font-size:.8rem;font-weight:800;background:#1a1608}
.sel2{text-align:left;font-size:1.15rem;padding:.8rem 1rem}
.upg{display:grid;grid-template-columns:1fr 6.5rem 5rem;align-items:center;gap:.5rem;color:var(--green);font-weight:700;font-size:.95rem}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:.7rem}
.segs i{background:#14281d;border-radius:1px}.segs i.b{background:var(--green)}.segs i.u{background:var(--yellow)}
.upg .btn{padding:.3rem .2rem;font-size:.85rem;border-radius:2rem;background:var(--yellow);color:#1b1500;border:0}
.wtxt{font-family:var(--mono);font-size:.85rem;line-height:1.35;color:var(--ink);font-weight:500}
#launch{font-size:2.4rem;padding:.9rem}
/* hud */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);color:var(--green)}
#hud button,#hud .tap{pointer-events:auto}
#pad{position:absolute;inset:0;pointer-events:auto;touch-action:none}
.hb{position:absolute;background:#10261cb0;border:2px solid #4adf7a88;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--green);font-family:var(--ui);font-weight:700;touch-action:none}
.hb small{display:block;font-size:.8rem;color:#b8ffc9}
#topbar{position:absolute;top:.8rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1rem;background:#0b1c14e0;border:2px solid #2a5d41;border-radius:1rem;padding:.5rem 1.4rem;font-family:var(--ui);font-weight:800;font-size:1.3rem;pointer-events:none}
#topbar b{font-size:1.5rem}#topbar .tb{width:7rem;height:.5rem;background:#fff;position:relative}
#topbar .tb i{position:absolute;top:-.25rem;width:.6rem;height:1rem}
#obj{position:absolute;top:4.6rem;left:50%;transform:translateX(-50%);color:var(--yellow);font-size:1.3rem;white-space:nowrap;text-shadow:0 0 6px #000}
#feed{position:absolute;top:7rem;left:max(16px,env(safe-area-inset-left));font-size:1.2rem;font-weight:500;text-shadow:0 0 5px #000;display:flex;flex-direction:column;gap:.2rem;pointer-events:none;margin-left:15rem}
#hudc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#0006 100%)}
#stk{position:absolute;width:9rem;height:9rem;margin:-4.5rem 0 0 -4.5rem;border-radius:50%;border:2px solid #6cff8c88;background:#10261c44;pointer-events:none;display:none}
#stk i{position:absolute;left:50%;top:50%;width:3.6rem;height:3.6rem;margin:-1.8rem 0 0 -1.8rem;border-radius:50%;background:#6cff8c66;border:2px solid #6cff8c}
#hint{position:absolute;left:50%;bottom:17rem;transform:translateX(-50%);font-size:1rem;color:#b8ffc9;text-shadow:0 0 5px #000;white-space:nowrap;pointer-events:none;opacity:.85}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.topbtns{position:absolute;top:1rem;right:max(12px,env(safe-area-inset-right));display:grid;grid-template-columns:repeat(3,auto);gap:.5rem}
.topbtns button{width:5.4rem;height:5.4rem;background:#12302299;border:2px solid #3fb86599;border-radius:1rem;color:var(--green);font-weight:700;font-size:.95rem;font-family:var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
.topbtns button.on{border-color:var(--yellow);color:var(--yellow)}
.topbtns svg{width:2.2rem;height:2.2rem}
#radarw{position:absolute;left:max(16px,env(safe-area-inset-left));top:7.5rem;width:13rem;text-align:center;font-size:1.4rem}
#radar{width:13rem;height:13rem;border-radius:50%;background:#2b4a3acc;border:3px solid #4adf7a88;display:block}
#thr{position:absolute;left:max(16px,env(safe-area-inset-left));top:25rem;width:9.4rem;height:min(28rem,calc(100% - 38rem));pointer-events:auto;touch-action:none}
#thr .ab{height:3rem;background:#6d684e;border-radius:1rem 1rem 0 0;text-align:center;line-height:3rem;font-weight:700;font-family:var(--ui);color:#e8e0b0}
#thr .ab.on{background:var(--orange);color:#fff}
#thr .tr{position:absolute;top:3rem;bottom:0;left:0;right:0;background:#1b2d2599;border:2px solid #4adf7a66;border-top:0;border-radius:0 0 1rem 1rem}
#thr .fl{position:absolute;left:.5rem;right:.5rem;bottom:.4rem;background:var(--green);border-radius:.5rem;height:1rem;max-height:calc(100% - .8rem)}
#gunb{left:max(16px,env(safe-area-inset-left));bottom:1rem;width:0}
#fireg{left:calc(max(16px,env(safe-area-inset-left)) + 11rem);bottom:1.5rem;width:12rem;height:12rem;font-size:1.5rem}
#firew{left:calc(max(16px,env(safe-area-inset-left)) + 21rem);bottom:9.5rem;width:9.5rem;height:9.5rem;font-size:1.05rem}
#nextw{left:calc(max(16px,env(safe-area-inset-left)) + 29rem);bottom:1rem;width:7rem;height:7rem;font-size:.85rem}
#zoomb{right:max(12px,env(safe-area-inset-right));top:30%;width:7.5rem;height:7.5rem;font-size:.95rem}
#flareb{right:max(12px,env(safe-area-inset-right));top:calc(30% + 8.5rem);width:8rem;height:8rem;font-size:1.05rem}
#slots{position:absolute;left:50%;bottom:.8rem;transform:translateX(-50%);display:flex;gap:.6rem;font-family:var(--ui)}
.slot{width:11rem;height:7rem;background:#2b5e43;border:3px solid #3a7a58;border-radius:.4rem;position:relative;font-weight:700;font-size:1rem;padding:.5rem;display:flex;flex-direction:column;justify-content:flex-end}
.slot.sel{border-color:var(--green);box-shadow:0 0 0 3px #6cff8c66}
.slot .k{position:absolute;top:.4rem;left:.4rem;background:#63b3ff;color:#06203a;border-radius:.3rem;padding:.1rem .5rem;font-weight:800}
.slot.ag .k{background:#ffb347;color:#3a2200}
.slot .n{position:absolute;top:.4rem;right:.4rem;background:#0d1d16;padding:.1rem .6rem}
.slot.rearm{background:#3a2e12;border-color:var(--yellow);color:var(--yellow);align-items:center;justify-content:center;font-weight:800}
#ring{position:absolute;left:50%;top:50%;width:min(44vh,44vw);height:min(44vh,44vw);transform:translate(-50%,-50%);border:3px solid #6cff8ccc;border-radius:50%;pointer-events:none;transition:width .2s,height .2s}
#aim{position:absolute;left:50%;top:50%;width:1.2rem;height:1.2rem;transform:translate(-50%,-50%);border:2px solid var(--green);border-radius:50%}
#rdspd{position:absolute;left:calc(50% - min(44vh,44vw)/2 - 13rem);top:44%;width:11rem;text-align:right;font-size:1.1rem}
#rdalt{position:absolute;left:calc(50% + min(44vh,44vw)/2 + 2rem);top:44%;width:13rem;font-size:1.1rem}
.rdbox{border:2px solid var(--green);background:#10261c88;padding:.3rem .8rem;font-size:2.3rem;letter-spacing:.05em;text-align:center;margin:.2rem 0}
#msg{position:absolute;left:50%;top:calc(50% + min(44vh,44vw)/2 + 1.2rem);transform:translateX(-50%);color:var(--yellow);font-size:1.6rem;white-space:nowrap;text-shadow:0 0 6px #000}
#big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--ui);font-size:2.6rem;font-weight:800;color:var(--blue);text-shadow:0 0 8px #000;text-align:center}
#warn{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:2.2rem;font-weight:800;color:var(--red);font-family:var(--ui);text-shadow:0 0 8px #000;text-align:center;line-height:1.2}
#hpbar{position:absolute;left:50%;bottom:8.6rem;transform:translateX(-50%);width:18rem;height:.7rem;background:#0008;border:2px solid #4adf7a88;border-radius:.4rem;overflow:hidden}
#hpbar i{display:block;height:100%;background:var(--green)}
.tg{position:absolute;left:0;top:0;pointer-events:none;font-size:1rem;white-space:nowrap;will-change:transform}
.tg .dm{width:1.4rem;height:1.4rem;border:2px solid;transform:rotate(45deg);margin:0 auto}
.tg .tx{text-align:center;margin-top:.4rem;text-shadow:0 0 4px #000;font-weight:500}
.tg.lk .dm{width:2.6rem;height:2.6rem;border-width:3px}
#hitm{position:absolute;left:50%;top:50%;width:3rem;height:3rem;transform:translate(-50%,-50%) rotate(45deg);border:3px solid #fff;opacity:0;pointer-events:none}
#dmg{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 12rem #ff2a1a;opacity:0}
/* overlays */
.ov{position:absolute;inset:0;background:#050d0acc;display:grid;place-items:center}
.card{background:#0b1c14;border:2px solid var(--line);border-radius:1.2rem;padding:1.2rem 1.6rem;width:min(46rem,92%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:.7rem;font-size:1.1rem}
.card h2{margin:0;color:var(--green);font-size:1.8rem}
.card .btn{font-size:1.2rem}
.card table{border-collapse:collapse;width:100%}.card td{padding:.35rem .5rem;border-bottom:1px solid #1d3a2b}
.kbd{display:inline-block;background:#143222;border:1px solid var(--line);border-radius:.3rem;padding:0 .4rem;font-family:var(--mono);color:var(--yellow)}
#mapc{width:min(80vh,92vw);height:min(80vh,92vw);border:2px solid var(--line);border-radius:1rem;background:#0b2a44}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#0b1c14;border:2px solid var(--yellow);color:var(--yellow);font-weight:800;padding:.7rem 1.4rem;border-radius:1rem;font-size:1.3rem;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
@media (max-aspect-ratio:3/2){html{font-size:clamp(8px,min(1.1vw,2.1vh),16px)}}
@media (max-width:760px) and (orientation:portrait){#rot{display:grid}}
#rot{display:none;position:absolute;inset:0;background:#050d0a;place-items:center;text-align:center;font-size:1.6rem;color:var(--green);z-index:99;padding:2rem}
</style>

    if(dt>0&&Math.random()<dt*(small?6:10)){const bx=x-dx*s.L*.5,bz=z-dz*s.L*.5;smokeP.emit(bx+rnd(-s.W*.3,s.W*.3),.5,bz,rnd(-1,1),.4,rnd(-1,1),2.5,s.W*.3,s.W*.9,[1,1,1,.5],[1,1,1,0],0);}

/* ---------- flight model ---------- */
const AZ=new V3(0,0,1);
function flyPlane(p,dt){
  const d=p.def,u=p.up;
  const maxS=d.maxSpd*(1+.05*u.spd)*(p.ab?1.15:1);
  let tgt=maxS*p.thr;if(p.brk)tgt*=.7;if(p.gear)tgt*=.9;if(p.flaps)tgt*=.94;
  tA.set(0,0,-1).applyQuaternion(p.q);
  const acc=Math.min(1,dt*.45*d.thrust*(1+.08*u.thr)*(tgt>p.speed?1.4:1));
  p.speed+=(tgt-p.speed)*acc-tA.y*9.8*.8*dt;if(p.brk)p.speed-=16*dt;
  /* hard turns bleed energy */
  p.speed-=Math.max(0,Math.abs(p.g)-2.5)*.9*dt;p.speed=Math.max(p.speed,0);
  const stl=d.stall*(p.flaps?.85:1);p.stalled=p.speed<stl;
  const auth=clamp((p.speed-stl*.4)/(d.maxSpd*.4),.18,1);
  tB.set(1,0,0).applyQuaternion(p.q);tC.set(0,1,0).applyQuaternion(p.q);
  const bank=Math.atan2(-tB.y,tC.y);p.bank=bank;
  let sx=p.inp.x,sy=p.inp.y,rollIn=sx;
  if(p.assist||p.aimCtl){
    if(!p.aimCtl){
      const want=Math.abs(sx)<.05?(Math.abs(tA.y)<.9?0:bank):sx*1.2;
      let err=want-bank;while(err>Math.PI)err-=6.283;while(err<-Math.PI)err+=6.283;
      rollIn=clamp(err*2.5,-1,1);
    }
    /* coordinated turn: banking makes the nose follow */
    const yawW=-(9.8*Math.tan(clamp(bank,-1.2,1.2))/Math.max(p.speed,55))*.85*Math.max(0,tC.y);
    tQ.setFromAxisAngle(AY,yawW*dt);p.q.premultiply(tQ);
  }
  /* rotational inertia: the airframe eases into the commanded rates */
  const pr=1.25*d.turn*(1+.05*u.trn)*auth;
  const rr=p.rate||(p.rate={p:0,r:0,y:0});
  const k=Math.min(1,dt*(p.isPlayer?9:12));
  rr.p+=(sy*pr-rr.p)*k;rr.r+=(-rollIn*2.7*(.5+.5*auth)-rr.r)*k;rr.y+=(-p.inp.yaw*.5*auth-rr.y)*k;
  tQ.setFromAxisAngle(AX,rr.p*dt);p.q.multiply(tQ);
  tQ.setFromAxisAngle(AZ,rr.r*dt);p.q.multiply(tQ);
  if(Math.abs(rr.y)>1e-4){tQ.setFromAxisAngle(AY,rr.y*dt);p.q.multiply(tQ);}
  if(p.stalled){tA.set(0,0,-1).applyQuaternion(p.q);tB.set(tA.z,0,-tA.x);if(tB.lengthSq()>1e-4){tB.normalize();tQ.setFromAxisAngle(tB,(stl-p.speed)/stl*1.5*dt);p.q.premultiply(tQ);}}
  p.q.normalize();
  tA.set(0,0,-1).applyQuaternion(p.q);p.vel.copy(tA).multiplyScalar(p.speed);p.pos.addScaledVector(p.vel,dt);
  p.g+=((1+rr.p*p.speed/9.8*.9)-p.g)*Math.min(1,dt*5);p.g=clamp(p.g,-3,9);
  engineFx(p,p.ab?1.6:(p.thr>.8?.8:.25*p.thr),p.thr>.05);
  const ud=p.mesh.userData;ud.gear.visible=p.gear;
  /* wing-tip vortices under G, engine contrails up high */
  if(p.speed>90&&Math.abs(p.g)>3.2){const a=clamp((Math.abs(p.g)-3.2)/3,0,1)*.45;
    for(const tp of ud.tips){tA.copy(tp).applyQuaternion(p.q).add(p.pos);smokeP.emit(tA.x,tA.y,tA.z,0,0,0,.9,.5,2.4,[1,1,1,a],[1,1,1,0],0);}}
  if(p.pos.y>2000&&p.speed>120){tA.set(0,0,1).applyQuaternion(p.q).multiplyScalar(d.b.L/2+4).add(p.pos);smokeP.emit(tA.x,tA.y,tA.z,0,0,0,4,1.4,7,[1,1,1,clamp((p.pos.y-2000)/600,0,.32)],[1,1,1,0],0);}
  if(p.thr>.7||p.ab){tA.set(0,0,1).applyQuaternion(p.q).multiplyScalar(p.def.b.L/2+1.5).add(p.pos);fire(tA.x,tA.y,tA.z,p.ab?1.8:1,.2,.18,1.5);}
}
function engineFx(p,k,on){
  const u=p.mesh.userData,f=.88+Math.random()*.24;
  u.flames.forEach(fl=>{fl.visible=on&&k>.3;fl.scale.set(1,1,k*f);fl.material.opacity=clamp(k*.3,0,.45);});
  u.cores.forEach(c=>{c.visible=on;c.scale.set(1,1,Math.max(.25,k*.9)*f);});
  u.glows.forEach(g=>{g.material.opacity=on?.25+Math.min(k,1.2)*.55:.05;});
  const t=performance.now()/1000;u.strobe.visible=(t+p.pos.x*.01)%1.3<.08;
}

function updatePlane(p,dt){
  if(p.shield>0&&p.state==='fly')p.shield-=dt;
  for(const k in p.cd)p.cd[k]=Math.max(0,p.cd[k]-dt);
  const c=T[p.team].carrier;
  if(p.state==='cat'){
    cWorld(c,-8,DECK_Y+p.mesh.userData.gearH,70,p.pos);p.q.setFromAxisAngle(AY,c.rot);p.speed=0;p.vel.set(0,0,0);
    engineFx(p,p.thr>.94?1.4:p.thr,p.thr>.1);p.mesh.userData.gear.visible=true;
    if(p.thr>.6&&Math.random()<dt*20){tA.set(0,0,1).applyQuaternion(p.q).multiplyScalar(p.def.b.L/2+6).add(p.pos);smoke(tA.x,DECK_Y+1,tA.z,2,9,1.2,4,.25);}
    if(p.thr>=.94||p.autoGo){p.state='launch';p.launchT=0;p.ab=true;sfx('cat');say('ЗАПУСК');}
    return;
  }
  if(p.state==='launch'){
    p.launchT+=dt;p.speed=Math.min(p.def.stall*1.7+25,p.speed+(p.def.stall*1.7+25)/1.5*dt);
    tA.set(0,0,-1).applyQuaternion(p.q);p.vel.copy(tA).multiplyScalar(p.speed);p.pos.addScaledVector(p.vel,dt);p.pos.y=DECK_Y+p.mesh.userData.gearH;
    engineFx(p,1.6,true);p.mesh.userData.gear.visible=true;
    if(Math.random()<dt*30){tA.set(0,0,1).applyQuaternion(p.q).multiplyScalar(p.def.b.L/2+4).add(p.pos);smoke(tA.x,DECK_Y+1,tA.z,2,10,1,3,.3);}
    camShake=Math.max(camShake,p.isPlayer?.25:0);
    cLocal(c,p.pos,tC);
    if(tC.z<-160){p.state='fly';p.shield=5;p.grace=3;tQ.setFromAxisAngle(AX,.14);p.q.multiply(tQ);p.thr=1;p.gear=false;say('');if(p.isPlayer){thrTarget=1;aimDir.set(0,0,-1).applyQuaternion(p.q);rotateAim(0,.16);}}
    return;
  }
  if(p.state==='deck'){
    p.speed=Math.max(0,p.speed-45*dt);tA.set(0,0,-1).applyQuaternion(p.q);p.pos.addScaledVector(tA,p.speed*dt);p.pos.y=DECK_Y+p.mesh.userData.gearH;p.vel.set(0,0,0);p.deckT-=dt;
    engineFx(p,.1,false);p.mesh.userData.gear.visible=true;
    if(p.deckT<=0){rearm(p);cWorld(c,-8,DECK_Y+p.mesh.userData.gearH,70,p.pos);p.q.setFromAxisAngle(AY,c.rot);p.state='cat';p.thr=0;p.speed=0;say('НА КАТАПУЛЬТЕ: НАЖМИТЕ ОГОНЬ ИЛИ ГАЗ НА МАКСИМУМ');p.autoGo=false;if(p.isPlayer)thrTarget=0;}
    return;
  }
  flyPlane(p,dt);
  collide(p,dt);
  if(p.hp<p.maxhp*.45&&p.alive){p.smokeT-=dt;if(p.smokeT<=0){p.smokeT=.05;smoke(p.pos.x,p.pos.y,p.pos.z,3,8,2.2,.6,.6,p.hp<p.maxhp*.2);if(p.hp<p.maxhp*.2)fire(p.pos.x,p.pos.y,p.pos.z,3,1,.3,1);}}
}
function rearm(p){const ld=LOADS[p.isPlayer?(save.loadout[p.def.id]||0):0][1];p.hp=p.maxhp;p.ammo=p.def.ammo;p.aa=ld.aa;p.ag=ld.n;p.flares=p.def.flares;}

function collide(p,dt){
  const y=p.pos.y;if(p.grace>0)p.grace-=dt;
  if(y<1.5){crash(p,'water');return;}
  const th=terrainH(p.pos.x,p.pos.z);if(y<th){crash(p,'island');return;}
  for(const id of['blue','red']){
    const c=T[id].carrier;if(!c.alive||(p.grace>0&&id===p.team))continue;
    cLocal(c,p.pos,tC);
    if(Math.abs(tC.x)<50&&Math.abs(tC.z)<172&&tC.y<DECK_Y+3.5&&tC.y>-8){
      if(id===p.team&&tC.y>=DECK_Y-.5&&p.isPlayer){
        const vs=-p.vel.y;
        if(p.speed<150&&vs<16&&Math.abs(p.bank)<.7&&p.vel.y<4){landed(p);return;}
      }
      crash(p,'carrier');return;
    }
  }
  for(const id of['blue','red'])for(const b of T[id].boats){if(b.alive&&Math.hypot(b.pos.x-p.pos.x,b.pos.z-p.pos.z)<30&&y<34){crash(p,'ship');return;}}
  if(y<45)for(const s of civs){if(Math.hypot(s.x-p.pos.x,s.z-p.pos.z)<s.L*.5&&y<(s.L>100?36:10)){crash(p,'ship');return;}}
}
function landed(p){
  p.state='deck';p.deckT=3;p.pos.y=DECK_Y+p.mesh.userData.gearH;p.gear=true;
  tA.set(0,0,-1).applyQuaternion(p.q);tA.y=0;tA.normalize();tQ.setFromUnitVectors(new V3(0,0,-1),tA);p.q.copy(tQ);
  if(p.isPlayer){say('ПОСАДКА! ПЕРЕЗАРЯДКА...');save.cr+=25;mission('l');persist();toast('Посадка на авианосец +25 CR');sfx('beep');}
}
function crash(p,why){
  if(p.shield>0&&why==='water'){p.pos.y=3;tA.set(0,0,-1).applyQuaternion(p.q);tQ.setFromAxisAngle(AX,.3);p.q.multiply(tQ);return;}
  explosion(p.pos,why==='water'?16:20,why==='water');sfx('boom');
  killPlane(p,null,why==='water'?'вода':'столкновение');
}

/* ---------- damage ---------- */
function pname(p){return p.isPlayer?'ВЫ':p.pilot.call+' ('+p.pilot.name+')';}
function award(by,cr,pts){
  if(!by)return;by.pilot.score+=pts;
  if(by.isPlayer){save.cr+=cr;save.pts+=pts;persist();}
}
function dmgPlane(p,a,by,w){
  if(!p.alive||p.shield>0||match.over)return;
  if(match.training&&p.isPlayer===false&&by&&by.isPlayer===false)return;
  p.hp-=a;p.lastHit=by;
  if(p.isPlayer){dmgFlash=Math.min(1,dmgFlash+a/40);sfx('hit');}
  if(by&&by.isPlayer)hitMark();
  if(p.hp<=0)killPlane(p,by,w);
}
function killPlane(p,by,w){
  if(!p.alive)return;
  p.alive=false;explosion(p.pos,18,false);sfx('boom',p.pos);
  const col=T[p.team].color===T.blue.color?'var(--blue)':'var(--red)';
  feed('<span style="color:'+(by?(by.team==='blue'?'var(--blue)':'var(--red)'):'#ccc')+'">'+(by?pname(by):'—')+'</span> ['+(w||'?')+'] <span style="color:'+col+'">'+pname(p)+'</span>');
  if(by&&by.team!==p.team){award(by,100,100);if(by.isPlayer){mission('k');}}
  if(!match.training)T[p.team].tickets=Math.max(0,T[p.team].tickets-4);
  const wasPlayer=p.isPlayer;
  removePlane(p);p.pilot.rt=5;
  if(wasPlayer){player=null;deadBy=by?pname(by):(w||'');deadT=2.6;state='dead';}
  checkEnd();
}
function dmgShip(s,a,by,w){
  if(!s.alive||match.over)return;
  s.hp-=a;if(by&&by.isPlayer)hitMark();
  if(s.kind==='carrier'&&!match.training)T[s.team].tickets=Math.max(0,T[s.team].tickets-a/CARR_HP*50);
  if(s.hp<=0){
    s.alive=false;explosion(s.pos.clone().setY(15),s.kind==='carrier'?60:34,false);sfx('boom');
    feed('<span style="color:'+(by?(by.team==='blue'?'var(--blue)':'var(--red)'):'#ccc')+'">'+(by?pname(by):'—')+'</span> ['+(w||'?')+'] <span style="color:'+(s.team==='blue'?'var(--blue)':'var(--red)')+'">'+s.name+'</span>');
    if(s.kind==='boat'){if(!match.training)T[s.team].tickets=Math.max(0,T[s.team].tickets-12);if(by&&by.team!==s.team){award(by,150,150);if(by.isPlayer)mission('b');}}
    else{if(by&&by.team!==s.team)award(by,1000,500);}
    sinkers.push({s,t:0});checkEnd();
  }
}
let dmgFlash=0,hitFlash=0,deadBy='',deadT=0,state='side';
function hitMark(){hitFlash=1;sfx('tick');}
function checkEnd(){
  if(match.over||match.training)return;
  for(const id of['blue','red']){const t=T[id];if(t.tickets<=0||!t.carrier.alive){endMatch(enemyOf(id));return;}}
}

/* ---------- ships ---------- */
function hitShip(s,pos,m){
  if(!s.alive)return false;
  if(s.kind==='carrier'){cLocal(s,pos,tD);return Math.abs(tD.x)<50+m&&Math.abs(tD.z)<172+m&&tD.y>-10&&tD.y<DECK_Y+32+m;}
  return Math.hypot(pos.x-s.pos.x,pos.z-s.pos.z)<24+m&&pos.y<32+m&&pos.y>-6;
}
function shipTargets(team){const t=T[team];const a=[];t.boats.forEach(b=>{if(b.alive)a.push(b);});if(t.carrier.alive)a.push(t.carrier);return a;}
function updateShips(dt){
  for(const id of['blue','red']){
    const t=T[id],en=T[enemyOf(id)],list=[t.carrier,...t.boats];
    const now=performance.now()/1000;
    for(const s of list){if(!s.alive)continue;const m=s.mesh,ph=s.pos.x*.01+s.pos.z*.003,big=s.kind==='carrier';

/* ---------- bot AI ---------- */
function fwdOf(p,o){return (o||new V3()).set(0,0,-1).applyQuaternion(p.q);}
function pickTarget(p){
  const a=p.ai,en=enemyOf(p.team);let best=null,bd=1e9;
  const grounds=shipTargets(en);
  if(p.role==='f'||p.def.id==='f4e'&&Math.random()<.4){
    for(const q of planes){if(q.team===p.team||!q.alive||q.state!=='fly')continue;const d=q.pos.distanceTo(p.pos);if(d<bd&&d<12000){bd=d;best=q;}}
  }
  if(!best){for(const s of grounds){const d=s.pos.distanceTo(p.pos)*(s.kind==='carrier'?1.6:1);if(d<bd){bd=d;best=s;}}}
  a.tgt=best;
}
function botThink(p,dt){
  const a=p.ai;if(p.state!=='fly')return;
  a.rt-=dt;if(a.rt<=0){a.rt=rnd(2,4);pickTarget(p);}
  if(a.tgt&&a.tgt.alive===false)a.tgt=null;
  const f=fwdOf(p,tD),tg=a.tgt;let aim=tA,dist=1e9,ang=3,ground=false;
  const passive=match.training&&p.team!==myTeam;
  if(a.egress>0){a.egress-=dt;aim.copy(p.pos).addScaledVector(f,3000);aim.y=Math.max(p.pos.y+900,1300);}
  else if(tg){
    ground=tg.kind!=='plane';aim.copy(tg.pos);dist=p.pos.distanceTo(aim);
    if(!ground){aim.addScaledVector(tg.vel,dist/800*a.skill);}
    else{aim.y=tg.pos.y+clamp((dist-1400)*.45,0,1200);if(dist<480||(dist<1300&&p.pos.y<230))a.egress=4.5;}
  }else{aim.set(0,1100,T[enemyOf(p.team)].carrier.z*.5);}
  fwdOf(p,tD);
  const thA=Math.max(terrainH(p.pos.x+tD.x*500,p.pos.z+tD.z*500),terrainH(p.pos.x+tD.x*1100,p.pos.z+tD.z*1100),0);
  if(p.pos.y<190+thA||(p.pos.y<520+thA&&tD.y<-.3)){aim.copy(p.pos);aim.x+=tD.x*1500;aim.z+=tD.z*1500;aim.y=p.pos.y+900;}
  if(Math.hypot(p.pos.x,p.pos.z)>13000){aim.set(0,1100,0);}
  // steering
  tB.copy(aim).sub(p.pos);const dd=tB.length()||1;tQ.copy(p.q).invert();tB.applyQuaternion(tQ).divideScalar(dd);
  ang=Math.acos(clamp(-tB.z,-1,1));
  const rollA=Math.atan2(tB.x,tB.y);
  p.assist=false;p.inp.x=clamp(rollA*2.2,-1,1);
  p.inp.y=clamp(ang*3,0,1)*(Math.cos(rollA)>.15||ang>1.6?1:.15);p.inp.yaw=0;
  p.thr=p.speed<p.def.stall*1.4?1:(ground?.8:.9);p.ab=!ground&&dist>2500&&ang<.5&&p.speed<p.def.maxSpd*.8;
  if(passive)return;
  // fire
  if(tg&&a.egress<=0){
    const aimErr=ang<.065+(1-a.skill)*.02;
    if(!ground&&dist<650&&aimErr)fireGun(p);
    if(ground&&dist<820&&ang<.1)fireGun(p);
    if(ground&&p.ag>0&&p.agType==='rocket'&&dist>800&&dist<2300&&ang<.1)fireRocket(p);
    if(!ground&&p.aa>0&&p.cd.wep<=0&&dist>700&&dist<4500&&ang<.3){a.lock+=dt;if(a.lock>1.4/a.skill){a.lock=0;p.cd.wep=9;p.aa--;launchMissile(p,tg,'aa',p.team,fwdOf(p,tC).multiplyScalar(4).add(p.pos));}}else if(ground||ang>.35)a.lock=0;
  }
  // flares
  for(const m of missiles){if(m.target===p&&m.pos.distanceTo(p.pos)<1400){if(p.cd.fl<=0&&Math.random()<.5)dropFlares(p);p.inp.x=Math.random()<.5?1:-1;p.inp.y=1;break;}}
}

  state=state==='hud'?'result':state;
  showModal('<h2>'+(winner==='blue'?'ПОБЕДА СИНИХ':'ПОБЕДА КРАСНЫХ')+'</h2><div>'+(win?'Ваша команда победила.':'Ваша команда проиграла.')+' Награда: <b style="color:var(--yellow)">+'+bonus+' CR</b></div><div style="color:var(--dim)">Новый бой начнётся через несколько секунд.</div>');
  setTimeout(()=>{closeModal();if(player){removePlane(player);player=null;}resetMatch();toHangar();},7000);
}
function setTeam(id){

let AC=null,master=null,noiseBuf=null,eOsc=null,eGain=null,eNoise=null,eFilter=null;

  const dot=(wx,wz,s,col,tri)=>{const dx=wx-p.pos.x,dz=wz-p.pos.z;let a=(dx*-nz+dz*nx),b=-(dx*nx+dz*nz);const d=Math.hypot(a,b);if(d>range){a*=range/d;b*=range/d;}
    const x=C+a/range*R,y=C+b/range*R;rctx.fillStyle=col;if(tri){rctx.beginPath();rctx.moveTo(x,y-s*.7);rctx.lineTo(x+s*.6,y+s*.5);rctx.lineTo(x-s*.6,y+s*.5);rctx.fill();}else rctx.fillRect(x-s/2,y-s/2,s,s);};
  for(const id of['blue','red']){const t=T[id],col=id==='blue'?'#5aa8ff':'#ff6a5a';[t.carrier,...t.boats].forEach(s=>{if(s.alive)dot(s.pos.x,s.pos.z,s.kind==='carrier'?14:9,col);});}
  CITIES.forEach(c=>dot(c.x,c.z,16,'rgba(200,210,220,.35)'));civs.forEach(s=>dot(s.x,s.z,s.L>100?6:4,'#d8d8d8'));
  planes.forEach(q=>{if(q.alive&&q!==p)dot(q.pos.x,q.pos.z,11,q.team==='blue'?'#5aa8ff':'#ff6a5a',true);});
  for(const m of missiles)if(m.target===p)dot(m.pos.x,m.pos.z,6,'#ffffff');
  rctx.fillStyle='#6cff8c';rctx.beginPath();rctx.moveTo(C,C-9);rctx.lineTo(C+6,C+6);rctx.lineTo(C-6,C+6);rctx.fill();
}
/* vector HUD drawn on a 2D canvas over the 3D view */
const hctx=$('#hudc').getContext('2d');
const hv=new V3(),hv2=new V3(),hq=new QT(),pv=new V3();
function prj(v){pv.copy(v).project(camera);if(pv.z>1||pv.z<-1)return null;return [(pv.x*.5+.5)*innerWidth,(-pv.y*.5+.5)*innerHeight];}
function pdir(h,th){hv2.set(Math.sin(h)*Math.cos(th),Math.sin(th),-Math.cos(h)*Math.cos(th)).multiplyScalar(3000).add(camera.position);return prj(hv2);}
function edgeArrow(c,target,cx,cy,R,col,size){
  hq.copy(camera.quaternion).invert();hv2.copy(target).sub(camera.position).applyQuaternion(hq);
  const a=Math.atan2(-hv2.y,hv2.x);const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
  c.save();c.translate(x,y);c.rotate(a);c.fillStyle=col;c.beginPath();c.moveTo(size,0);c.lineTo(-size*.6,size*.7);c.lineTo(-size*.6,-size*.7);c.closePath();c.fill();c.restore();
}
function drawHud(p){
  const c=hctx,W=innerWidth,H=innerHeight;c.setTransform(hudScale,0,0,hudScale,0,0);c.clearRect(0,0,W,H);
  if(!p||!p.alive||(p.state!=='fly'&&p.state!=='launch'))return;
  const cx=W/2,cy=H/2,RR=Math.min(W,H)*.22,fs=Math.max(11,Math.min(16,H/60));
  c.font='500 '+fs+'px "Roboto Mono",monospace';c.textAlign='center';c.textBaseline='middle';c.lineCap='round';
  c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=3;
  const f=fwdOf(p,hv),hdg=Math.atan2(f.x,-f.z),pitch=Math.asin(clamp(f.y,-1,1));
  /* pitch ladder (world-referenced) */
  c.strokeStyle='rgba(108,255,140,.55)';c.fillStyle='rgba(108,255,140,.75)';c.lineWidth=1.6;
  for(let deg=-80;deg<=80;deg+=10){const th=deg*Math.PI/180;if(Math.abs(th-pitch)>.5)continue;
    const half=deg===0?.42:.1,gap=deg===0?.07:.04;
    for(const s of[-1,1]){const a=pdir(hdg+s*gap,th),b=pdir(hdg+s*half,th);if(!a||!b)continue;
      c.setLineDash(deg<0?[7,6]:[]);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);
      if(deg!==0){const tip=pdir(hdg+s*half,th+(deg>0?-.012:.012));if(tip)c.lineTo(tip[0],tip[1]);}c.stroke();
      if(deg!==0){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;c.fillText(Math.abs(deg),b[0]+dx/l*16,b[1]+dy/l*16);}}
  }
  c.setLineDash([]);
  /* heading tape */
  const hd=(hdg*180/Math.PI+360)%360,ty=cy-RR-26,tw=RR*.95;
  c.strokeStyle='rgba(108,255,140,.7)';c.lineWidth=1.5;
  for(let k=Math.ceil((hd-40)/5)*5;k<=hd+40;k+=5){const x=cx+(k-hd)/40*tw;const m=((k%360)+360)%360;c.beginPath();c.moveTo(x,ty);c.lineTo(x,ty-(m%10===0?9:5));c.stroke();
    if(m%30===0){c.fillText(({0:'С',90:'В',180:'Ю',270:'З'})[m]||String(m/10).padStart(2,'0'),x,ty-20);}}
  c.beginPath();c.moveTo(cx,ty+3);c.lineTo(cx-6,ty+11);c.lineTo(cx+6,ty+11);c.closePath();c.fill();
  c.fillText(String(Math.round(hd)%360).padStart(3,'0'),cx,ty+24);
  /* gun boresight: where the nose (and the guns) actually point */
  const bs=prj(hv2.copy(p.pos).addScaledVector(f,800));
  if(bs){c.strokeStyle='#6cff8c';c.lineWidth=2;const [x,y]=bs;c.beginPath();c.moveTo(x-16,y);c.lineTo(x-6,y);c.moveTo(x+6,y);c.lineTo(x+16,y);c.moveTo(x,y-16);c.lineTo(x,y-6);c.stroke();c.beginPath();c.arc(x,y,1.8,0,7);c.fillStyle='#6cff8c';c.fill();}
  /* gun lead pipper for the locked or nearest target in front */
  let tq=p.lockT&&p.lockT.alive?p.lockT:null,bd=1600;
  if(!tq)for(const q of planes){if(!q.alive||q.team===p.team||q.state!=='fly')continue;hv2.copy(q.pos).sub(p.pos);const d=hv2.length();if(d<bd&&hv2.dot(f)/d>.85){bd=d;tq=q;}}
  if(tq){const d0=tq.pos.distanceTo(p.pos);
    if(d0<1600){const vb=p.speed+900;let t=d0/vb;for(let i=0;i<3;i++){hv2.copy(tq.pos).addScaledVector(tq.vel,t);t=hv2.distanceTo(p.pos)/vb;}
      hv2.copy(tq.pos).addScaledVector(tq.vel,t);hv2.y+=.5*9.8*.6*t*t;hv2.sub(p.pos).normalize();
      const pp=prj(hv2.multiplyScalar(800).add(p.pos));
      if(pp){const on=bs&&Math.hypot(pp[0]-bs[0],pp[1]-bs[1])<14;c.strokeStyle=on?'#ffffff':'#ffb347';c.lineWidth=2;c.beginPath();c.arc(pp[0],pp[1],11,0,7);c.stroke();c.beginPath();c.arc(pp[0],pp[1],2.5,0,7);c.fillStyle=c.strokeStyle;c.fill();
        if(bs){c.strokeStyle='rgba(255,179,71,.35)';c.lineWidth=1;c.beginPath();c.moveTo(bs[0],bs[1]);c.lineTo(pp[0],pp[1]);c.stroke();}
        c.fillStyle='#ffb347';c.fillText(Math.round(d0)+' м',pp[0],pp[1]+24);}}}
  /* missile lock progress */
  if(p.sel===0&&p.lockT&&p.lockT.alive&&!p.locked){const lp=prj(p.lockT.pos);if(lp){c.strokeStyle='#ff9a3c';c.lineWidth=3;c.beginPath();c.arc(lp[0],lp[1]-2,30,-Math.PI/2,-Math.PI/2+6.283*clamp(p.lockTime||0,0,1));c.stroke();}}
  if(p.sel===0&&p.locked&&p.lockT){const lp=prj(p.lockT.pos);if(lp){const t=performance.now()/400;c.strokeStyle='#ff9a3c';c.lineWidth=2.5;c.save();c.translate(lp[0],lp[1]-2);c.rotate(t);c.strokeRect(-24,-24,48,48);c.restore();}}
  /* arrows to off-screen enemies and incoming missiles */
  let shown=0;
  const ens=planes.filter(q=>q.alive&&q.team!==p.team&&q.state==='fly').map(q=>[q,q.pos.distanceTo(p.pos)]).sort((a,b)=>a[1]-b[1]);
  for(const [q,d] of ens){if(d>6000||shown>=3)break;const sp=prj(q.pos);if(sp&&sp[0]>0&&sp[0]<W&&sp[1]>0&&sp[1]<H)continue;edgeArrow(c,q.pos,cx,cy,RR*1.08,'rgba(255,120,90,.85)',11);shown++;}
  const blink=Math.floor(performance.now()/180)%2===0;
  for(const m of missiles){if(m.target!==p)continue;edgeArrow(c,m.pos,cx,cy,RR*.92,blink?'#ff3a2a':'#ffffff',16);}
  c.shadowBlur=0;
}
/* ---------- main loop ---------- */
function step(dt){
  if(!match.over&&!match.training){match.t-=dt;if(match.t<=0){endMatch(T.blue.tickets>=T.red.tickets?'blue':'red');}}
  for(const id of['blue','red'])for(const pl of T[id].pilots){if(pl.isPlayer||pl.plane)continue;pl.rt-=dt;if(pl.rt<=0&&!match.over)spawnBot(pl);}
  for(const p of planes){if(!p.alive)continue;if(p.isPlayer)controlPlayer(p,dt);else botThink(p,dt);updatePlane(p,dt);}
  planes=planes.filter(p=>p.alive);
  updateShips(dt);updateCivs(dt);updateBullets(dt);updateRockets(dt);updateBombs(dt);updateMissiles(dt);updateFlares(dt);
  smokeP.update(dt);fireP.update(dt);updateFx(dt);
  if(state==='dead'){deadT-=dt;if(deadT<=0)toHangar();}
  if(state==='side'&&Math.floor(performance.now()/1000)!==renderSide.s){renderSide.s=Math.floor(performance.now()/1000);renderSide();}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    pollPad(dt);
    const paused=state==='hud'&&!$('#modal').hidden&&!match.over;
    if(!paused){step(dt);updateCamera(dt);}
    waterMat.uniforms.t.value=now/1000;const px=innerHeight*renderer.getPixelRatio()*.5/Math.tan(camera.fov*Math.PI/360);smokeP.mat.uniforms.px.value=px;fireP.mat.uniforms.px.value=px;
    if(state==='hud'||state==='dead'){updateHud(dt);drawHud(state==='hud'?player:null);}
    engineSound();
    if(composer)composer.render(dt);else renderer.render(scene,camera);
  }catch(err){console.error(err);}
}
initWorld();resetMatch();show('side');renderSide();requestAnimationFrame(frame);
</script>
