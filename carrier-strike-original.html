<style>
/* Layout: full-screen 3D view, HUD overlay, side-select and hangar screens on top */
:root{--bg:#0a1510;--panel:#0b1c14ee;--line:#2f7a4e;--green:#6cff8c;--green2:#3fb865;--yellow:#ffc94a;--blue:#4f8fd6;--red:#e0584c;--ink:#e6fff0;--dim:#8fb8a0;--orange:#ff7a3c;

.btn.d{opacity:.45}

#hpbar{position:absolute;left:50%;bottom:8.6rem;transform:translateX(-50%);width:18rem;height:.7rem;background:#0008;border:2px solid #4adf7a88;border-radius:.4rem;overflow:hidden}

#hitm{position:absolute;left:50%;top:48%;width:3rem;height:3rem;transform:translate(-50%,-50%) rotate(45deg);border:3px solid #fff;opacity:0;pointer-events:none}
#dmg{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 12rem #ff2a1a;opacity:0}
/* overlays */
.ov{position:absolute;inset:0;background:#050d0acc;display:grid;place-items:center}
.card{background:#0b1c14;border:2px solid var(--line);border-radius:1.2rem;padding:1.2rem 1.6rem;width:min(46rem,92%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:.7rem;font-size:1.1rem}

.card .btn{font-size:1.2rem}

.kbd{display:inline-block;background:#143222;border:1px solid var(--line);border-radius:.3rem;padding:0 .4rem;font-family:var(--mono);color:var(--yellow)}
#mapc{width:min(80vh,92vw);height:min(80vh,92vw);border:2px solid var(--line);border-radius:1rem;background:#0b2a44}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#0b1c14;border:2px solid var(--yellow);color:var(--yellow);font-weight:800;padding:.7rem 1.4rem;border-radius:1rem;font-size:1.3rem;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}

class Particles{
  constructor(max,additive){
    this.max=max;this.i=0;
    this.pos=new Float32Array(max*3);this.col=new Float32Array(max*4);this.size=new Float32Array(max);
    this.vel=new Float32Array(max*3);this.age=new Float32Array(max).fill(9);this.life=new Float32Array(max).fill(1);
    this.s0=new Float32Array(max);this.s1=new Float32Array(max);this.c0=new Float32Array(max*4);this.c1=new Float32Array(max*4);this.grav=new Float32Array(max);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3));g.setAttribute('col',new THREE.BufferAttribute(this.col,4));g.setAttribute('size',new THREE.BufferAttribute(this.size,1));
    this.mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:additive?THREE.AdditiveBlending:THREE.NormalBlending,uniforms:{px:{value:800}},
      vertexShader:'attribute vec4 col;attribute float size;varying vec4 vC;uniform float px;void main(){vC=col;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*px/max(-mv.z,1.);gl_Position=projectionMatrix*mv;}',
      fragmentShader:'varying vec4 vC;void main(){vec2 d=gl_PointCoord-.5;float r=length(d)*2.;if(r>1.)discard;float a=smoothstep(1.,.2,r);gl_FragColor=vec4(vC.rgb,vC.a*a);}'});
    this.pts=new THREE.Points(g,this.mat);this.pts.frustumCulled=false;scene.add(this.pts);
  }
  emit(x,y,z,vx,vy,vz,life,s0,s1,c0,c1,grav){
    const i=this.i;this.i=(i+1)%this.max;
    this.pos[i*3]=x;this.pos[i*3+1]=y;this.pos[i*3+2]=z;this.vel[i*3]=vx;this.vel[i*3+1]=vy;this.vel[i*3+2]=vz;
    this.age[i]=0;this.life[i]=life;this.s0[i]=s0;this.s1[i]=s1;this.grav[i]=grav||0;
    for(let k=0;k<4;k++){this.c0[i*4+k]=c0[k];this.c1[i*4+k]=c1[k];}
  }
  update(dt){
    for(let i=0;i<this.max;i++){
      if(this.age[i]>=this.life[i]){this.size[i]=0;continue;}
      const a=this.age[i]+=dt,t=a/this.life[i];
      this.vel[i*3+1]-=this.grav[i]*dt;
      this.pos[i*3]+=this.vel[i*3]*dt;this.pos[i*3+1]+=this.vel[i*3+1]*dt;this.pos[i*3+2]+=this.vel[i*3+2]*dt;
      this.size[i]=this.s0[i]+(this.s1[i]-this.s0[i])*t;
      for(let k=0;k<4;k++)this.col[i*4+k]=this.c0[i*4+k]+(this.c1[i*4+k]-this.c0[i*4+k])*t;
    }
    const g=this.pts.geometry;g.attributes.position.needsUpdate=true;g.attributes.col.needsUpdate=true;g.attributes.size.needsUpdate=true;
  }
}

    fireP.vel[((fireP.i+fireP.max-1)%fireP.max)*3+2]=Math.sin(a)*Math.cos(e)*sp;

function wingGeo(c,t,s,sw,th,mir){const sh=new THREE.Shape();const m=mir?-1:1;sh.moveTo(0,c/2);sh.lineTo(m*s,c/2-sw);sh.lineTo(m*s,c/2-sw-t);sh.lineTo(0,-c/2);sh.closePath();

function finGeo(c,t,h,sw,th){const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(-sw,h);sh.lineTo(-sw-t,h);sh.lineTo(-c,0);sh.closePath();

function removePlane(p){scene.remove(p.mesh);p.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();});p.alive=false;if(p.pilot&&p.pilot.plane===p)p.pilot.plane=null;}

/* ---------- flight model ---------- */
function flyPlane(p,dt){
  const d=p.def,u=p.up;
  const maxS=d.maxSpd*(1+.05*u.spd)*(p.ab?1.15:1);
  let tgt=maxS*p.thr;if(p.brk)tgt*=.7;if(p.gear)tgt*=.9;if(p.flaps)tgt*=.94;
  tA.set(0,0,-1).applyQuaternion(p.q);
  const acc=Math.min(1,dt*.45*d.thrust*(1+.08*u.thr)*(tgt>p.speed?1.4:1));
  p.speed+=(tgt-p.speed)*acc-tA.y*9.8*.8*dt;if(p.brk)p.speed-=16*dt;p.speed=Math.max(p.speed,0);
  const stl=d.stall*(p.flaps?.85:1);p.stalled=p.speed<stl;
  const auth=clamp((p.speed-stl*.4)/(d.maxSpd*.4),.18,1);
  tB.set(1,0,0).applyQuaternion(p.q);tC.set(0,1,0).applyQuaternion(p.q);
  const bank=Math.atan2(-tB.y,tC.y);p.bank=bank;
  let sx=p.inp.x,sy=p.inp.y,rollIn=sx;
  if(p.assist){
    const want=Math.abs(sx)<.05?(Math.abs(tA.y)<.9?0:bank):sx*1.2;
    let err=want-bank;while(err>Math.PI)err-=6.283;while(err<-Math.PI)err+=6.283;
    rollIn=clamp(err*2.5,-1,1);
    const yawW=-(9.8*Math.tan(clamp(bank,-1.2,1.2))/Math.max(p.speed,55))*.85*Math.max(0,tC.y);
    tQ.setFromAxisAngle(AY,yawW*dt);p.q.premultiply(tQ);
  }
  const pr=1.25*d.turn*(1+.05*u.trn)*auth;
  tQ.setFromAxisAngle(AX,sy*pr*dt);p.q.multiply(tQ);
  tQ.setFromAxisAngle(AZ,-rollIn*2.7*(.5+.5*auth)*dt);p.q.multiply(tQ);
  if(p.inp.yaw){tQ.setFromAxisAngle(AY,-p.inp.yaw*.45*auth*dt);p.q.multiply(tQ);}
  if(p.stalled){tA.set(0,0,-1).applyQuaternion(p.q);tB.set(tA.z,0,-tA.x);if(tB.lengthSq()>1e-4){tB.normalize();tQ.setFromAxisAngle(tB,(stl-p.speed)/stl*1.5*dt);p.q.premultiply(tQ);}}
  p.q.normalize();
  tA.set(0,0,-1).applyQuaternion(p.q);p.vel.copy(tA).multiplyScalar(p.speed);p.pos.addScaledVector(p.vel,dt);
  p.g+=((1+sy*pr*p.speed/9.8*.9)-p.g)*Math.min(1,dt*5);p.g=clamp(p.g,-3,9);
  const fl=p.mesh.userData.flames;const k=p.ab?1.6:(p.thr>.8?.8:.25*p.thr);fl.forEach(f=>{f.scale.set(1,1,k);f.visible=p.thr>.05;});
  if(p.speed>90&&(Math.abs(p.g)>3.2||p.pos.y>2500)&&Math.random()<dt*40)smokeP.emit(p.pos.x,p.pos.y,p.pos.z,0,0,0,2.2,1.6,5,[1,1,1,.35],[1,1,1,0],0);
  if(p.thr>.7||p.ab){tA.set(0,0,1).applyQuaternion(p.q).multiplyScalar(p.def.b.L/2+1.5).add(p.pos);fire(tA.x,tA.y,tA.z,p.ab?1.8:1,.2,.18,1.5);}
}
const AZ=new V3(0,0,1);

function updatePlane(p,dt){
  if(p.shield>0&&p.state==='fly')p.shield-=dt;
  for(const k in p.cd)p.cd[k]=Math.max(0,p.cd[k]-dt);
  const c=T[p.team].carrier;
  if(p.state==='cat'){
    cWorld(c,-8,DECK_Y+1.6,70,p.pos);p.q.setFromAxisAngle(AY,c.rot);p.speed=0;p.vel.set(0,0,0);
    p.mesh.userData.flames.forEach(f=>f.visible=p.thr>.1);
    if(p.thr>=.94||p.autoGo){p.state='launch';p.launchT=0;p.ab=true;sfx('cat');say('ЗАПУСК');}
    return;
  }
  if(p.state==='launch'){
    p.launchT+=dt;p.speed=Math.min(p.def.stall*1.7+25,p.speed+(p.def.stall*1.7+25)/1.5*dt);
    tA.set(0,0,-1).applyQuaternion(p.q);p.vel.copy(tA).multiplyScalar(p.speed);p.pos.addScaledVector(p.vel,dt);p.pos.y=DECK_Y+1.6;
    p.mesh.userData.flames.forEach(f=>{f.visible=true;f.scale.set(1,1,1.6);});
    cLocal(c,p.pos,tC);
    if(tC.z<-160){p.state='fly';p.shield=5;p.grace=3;tQ.setFromAxisAngle(AX,.14);p.q.multiply(tQ);p.thr=1;say('');}
    return;
  }
  if(p.state==='deck'){
    p.speed=Math.max(0,p.speed-45*dt);tA.set(0,0,-1).applyQuaternion(p.q);p.pos.addScaledVector(tA,p.speed*dt);p.pos.y=DECK_Y+1.6;p.vel.set(0,0,0);p.deckT-=dt;
    p.mesh.userData.flames.forEach(f=>f.visible=false);
    if(p.deckT<=0){rearm(p);cWorld(c,-8,DECK_Y+1.6,70,p.pos);p.q.setFromAxisAngle(AY,c.rot);p.state='cat';p.thr=0;p.speed=0;say('НА КАТАПУЛЬТЕ: НАЖМИТЕ ОГОНЬ ИЛИ ГАЗ НА МАКСИМУМ');p.autoGo=false;}
    return;
  }
  flyPlane(p,dt);
  collide(p,dt);
  if(p.hp<p.maxhp*.45&&p.alive){p.smokeT-=dt;if(p.smokeT<=0){p.smokeT=.05;smoke(p.pos.x,p.pos.y,p.pos.z,3,8,2.2,.6,.6,p.hp<p.maxhp*.2);if(p.hp<p.maxhp*.2)fire(p.pos.x,p.pos.y,p.pos.z,3,1,.3,1);}}
}
function rearm(p){const ld=LOADS[p.isPlayer?(save.loadout[p.def.id]||0):0][1];p.hp=p.maxhp;p.ammo=p.def.ammo;p.aa=ld.aa;p.ag=ld.n;p.flares=p.def.flares;}

function collide(p,dt){
  const y=p.pos.y;if(p.grace>0)p.grace-=dt;
  if(y<1.5){crash(p,'water');return;}
  const th=terrainH(p.pos.x,p.pos.z);if(y<th){crash(p,'island');return;}
  for(const id of['blue','red']){
    const c=T[id].carrier;if(!c.alive||(p.grace>0&&id===p.team))continue;
    cLocal(c,p.pos,tC);
    if(Math.abs(tC.x)<50&&Math.abs(tC.z)<172&&tC.y<DECK_Y+3.5&&tC.y>-8){
      if(id===p.team&&tC.y>=DECK_Y-.5&&p.isPlayer){
        const vs=-p.vel.y;
        if(p.speed<150&&vs<16&&Math.abs(p.bank)<.7&&p.vel.y<4){landed(p);return;}
      }
      crash(p,'carrier');return;
    }
  }
  for(const id of['blue','red'])for(const b of T[id].boats){if(b.alive&&Math.hypot(b.pos.x-p.pos.x,b.pos.z-p.pos.z)<30&&y<34){crash(p,'ship');return;}}
}
function landed(p){
  p.state='deck';p.deckT=3;p.pos.y=DECK_Y+1.6;
  tA.set(0,0,-1).applyQuaternion(p.q);tA.y=0;tA.normalize();tQ.setFromUnitVectors(new V3(0,0,-1),tA);p.q.copy(tQ);
  if(p.isPlayer){say('ПОСАДКА! ПЕРЕЗАРЯДКА...');save.cr+=25;mission('l');persist();toast('Посадка на авианосец +25 CR');sfx('beep');}
}
function crash(p,why){
  if(p.shield>0&&why==='water'){p.pos.y=3;tA.set(0,0,-1).applyQuaternion(p.q);tQ.setFromAxisAngle(AX,.3);p.q.multiply(tQ);return;}
  explosion(p.pos,why==='water'?16:20,why==='water');sfx('boom');
  killPlane(p,null,why==='water'?'вода':'столкновение');
}

/* ---------- damage ---------- */
function pname(p){return p.isPlayer?'ВЫ':p.pilot.call+' ('+p.pilot.name+')';}
function award(by,cr,pts){
  if(!by)return;by.pilot.score+=pts;
  if(by.isPlayer){save.cr+=cr;save.pts+=pts;persist();}
}
function dmgPlane(p,a,by,w){
  if(!p.alive||p.shield>0||match.over)return;
  if(match.training&&p.isPlayer===false&&by&&by.isPlayer===false)return;
  p.hp-=a;p.lastHit=by;
  if(p.isPlayer){dmgFlash=Math.min(1,dmgFlash+a/40);sfx('hit');}
  if(by&&by.isPlayer)hitMark();
  if(p.hp<=0)killPlane(p,by,w);
}
function killPlane(p,by,w){
  if(!p.alive)return;
  p.alive=false;explosion(p.pos,18,false);sfx('boom',p.pos);
  const col=T[p.team].color===T.blue.color?'var(--blue)':'var(--red)';
  feed('<span style="color:'+(by?(by.team==='blue'?'var(--blue)':'var(--red)'):'#ccc')+'">'+(by?pname(by):'—')+'</span> ['+(w||'?')+'] <span style="color:'+col+'">'+pname(p)+'</span>');
  if(by&&by.team!==p.team){award(by,100,100);if(by.isPlayer){mission('k');}}
  if(!match.training)T[p.team].tickets=Math.max(0,T[p.team].tickets-4);
  const wasPlayer=p.isPlayer;
  removePlane(p);p.pilot.rt=5;
  if(wasPlayer){player=null;deadBy=by?pname(by):(w||'');deadT=2.6;state='dead';}
  checkEnd();
}
function dmgShip(s,a,by,w){
  if(!s.alive||match.over)return;
  s.hp-=a;if(by&&by.isPlayer)hitMark();
  if(s.kind==='carrier'&&!match.training)T[s.team].tickets=Math.max(0,T[s.team].tickets-a/CARR_HP*50);
  if(s.hp<=0){
    s.alive=false;explosion(s.pos.clone().setY(15),s.kind==='carrier'?60:34,false);sfx('boom');
    feed('<span style="color:'+(by?(by.team==='blue'?'var(--blue)':'var(--red)'):'#ccc')+'">'+(by?pname(by):'—')+'</span> ['+(w||'?')+'] <span style="color:'+(s.team==='blue'?'var(--blue)':'var(--red)')+'">'+s.name+'</span>');
    if(s.kind==='boat'){if(!match.training)T[s.team].tickets=Math.max(0,T[s.team].tickets-12);if(by&&by.team!==s.team){award(by,150,150);if(by.isPlayer)mission('b');}}
    else{if(by&&by.team!==s.team)award(by,1000,500);}
    sinkers.push({s,t:0});checkEnd();
  }
}
let dmgFlash=0,hitFlash=0,deadBy='',deadT=0,state='side';
function hitMark(){hitFlash=1;sfx('tick');}
function checkEnd(){
  if(match.over||match.training)return;
  for(const id of['blue','red']){const t=T[id];if(t.tickets<=0||!t.carrier.alive){endMatch(enemyOf(id));return;}}
}

/* ---------- ships ---------- */
function hitShip(s,pos,m){
  if(!s.alive)return false;
  if(s.kind==='carrier'){cLocal(s,pos,tD);return Math.abs(tD.x)<50+m&&Math.abs(tD.z)<172+m&&tD.y>-10&&tD.y<DECK_Y+32+m;}
  return Math.hypot(pos.x-s.pos.x,pos.z-s.pos.z)<24+m&&pos.y<32+m&&pos.y>-6;
}
function shipTargets(team){const t=T[team];const a=[];t.boats.forEach(b=>{if(b.alive)a.push(b);});if(t.carrier.alive)a.push(t.carrier);return a;}
function updateShips(dt){
  for(const id of['blue','red']){
    const t=T[id],en=T[enemyOf(id)],list=[t.carrier,...t.boats];
    t.carrier.mesh.userData&&0;
    const dish=t.carrier.mesh.children.find(o=>o.children&&o.children.length>=4);
    if(dish&&dish.children[3])dish.children[3].rotation.y+=dt*2;
    for(const s of list){
      if(!s.alive)continue;
      if(match.training&&id!==myTeam)continue;
      // AA guns
      s.gunCd-=dt;s.samCd-=dt;
      let best=null,bd=1900;

/* ---------- bot AI ---------- */
function fwdOf(p,o){return (o||new V3()).set(0,0,-1).applyQuaternion(p.q);}
function pickTarget(p){
  const a=p.ai,en=enemyOf(p.team);let best=null,bd=1e9;
  const grounds=shipTargets(en);
  if(p.role==='f'||p.def.id==='f4e'&&Math.random()<.4){
    for(const q of planes){if(q.team===p.team||!q.alive||q.state!=='fly')continue;const d=q.pos.distanceTo(p.pos);if(d<bd&&d<12000){bd=d;best=q;}}
  }
  if(!best){for(const s of grounds){const d=s.pos.distanceTo(p.pos)*(s.kind==='carrier'?1.6:1);if(d<bd){bd=d;best=s;}}}
  a.tgt=best;
}
function botThink(p,dt){
  const a=p.ai;if(p.state!=='fly')return;
  a.rt-=dt;if(a.rt<=0){a.rt=rnd(2,4);pickTarget(p);}
  if(a.tgt&&a.tgt.alive===false)a.tgt=null;
  const f=fwdOf(p,tD),tg=a.tgt;let aim=tA,dist=1e9,ang=3,ground=false;
  const passive=match.training&&p.team!==myTeam;
  if(a.egress>0){a.egress-=dt;aim.copy(p.pos).addScaledVector(f,3000);aim.y=Math.max(p.pos.y+900,1300);}
  else if(tg){
    ground=tg.kind!=='plane';aim.copy(tg.pos);dist=p.pos.distanceTo(aim);
    if(!ground){aim.addScaledVector(tg.vel,dist/800*a.skill);}
    else{aim.y=tg.pos.y+clamp((dist-1400)*.45,0,1200);if(dist<480||(dist<1300&&p.pos.y<230))a.egress=4.5;}
  }else{aim.set(0,1100,T[enemyOf(p.team)].carrier.z*.5);}
  fwdOf(p,tD);
  if(p.pos.y<190||(p.pos.y<520&&tD.y<-.3)){aim.copy(p.pos);aim.x+=tD.x*1500;aim.z+=tD.z*1500;aim.y=p.pos.y+900;}
  if(Math.hypot(p.pos.x,p.pos.z)>13000){aim.set(0,1100,0);}
  // steering
  tB.copy(aim).sub(p.pos);const dd=tB.length()||1;tQ.copy(p.q).invert();tB.applyQuaternion(tQ).divideScalar(dd);
  ang=Math.acos(clamp(-tB.z,-1,1));
  const rollA=Math.atan2(tB.x,tB.y);
  p.assist=false;p.inp.x=clamp(rollA*2.2,-1,1);
  p.inp.y=clamp(ang*3,0,1)*(Math.cos(rollA)>.15||ang>1.6?1:.15);p.inp.yaw=0;
  p.thr=p.speed<p.def.stall*1.4?1:(ground?.8:.9);p.ab=!ground&&dist>2500&&ang<.5&&p.speed<p.def.maxSpd*.8;
  if(passive)return;
  // fire
  if(tg&&a.egress<=0){
    const aimErr=ang<.065+(1-a.skill)*.02;
    if(!ground&&dist<650&&aimErr)fireGun(p);
    if(ground&&dist<820&&ang<.1)fireGun(p);
    if(ground&&p.ag>0&&p.agType==='rocket'&&dist>800&&dist<2300&&ang<.1)fireRocket(p);
    if(!ground&&p.aa>0&&p.cd.wep<=0&&dist>700&&dist<4500&&ang<.3){a.lock+=dt;if(a.lock>1.4/a.skill){a.lock=0;p.cd.wep=9;p.aa--;launchMissile(p,tg,'aa',p.team,fwdOf(p,tC).multiplyScalar(4).add(p.pos));}}else if(ground||ang>.35)a.lock=0;
  }
  // flares
  for(const m of missiles){if(m.target===p&&m.pos.distanceTo(p.pos)<1400){if(p.cd.fl<=0&&Math.random()<.5)dropFlares(p);p.inp.x=Math.random()<.5?1:-1;p.inp.y=1;break;}}
}

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null,eOsc=null,eGain=null,eNoise=null,eFilter=null;
function audioInit(){
  if(AC||!save.opt.sound)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    eOsc=AC.createOscillator();eOsc.type='sawtooth';eOsc.frequency.value=60;eFilter=AC.createBiquadFilter();eFilter.type='lowpass';eFilter.frequency.value=500;
    eGain=AC.createGain();eGain.gain.value=0;eOsc.connect(eFilter);
    eNoise=AC.createBufferSource();eNoise.buffer=noiseBuf;eNoise.loop=true;const ng=AC.createGain();ng.gain.value=.5;eNoise.connect(ng);ng.connect(eFilter);
    eFilter.connect(eGain);eGain.connect(master);eOsc.start();eNoise.start();
  }catch(e){AC=null;}
}
function noiseHit(dur,type,freq,vol,sweepTo){
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  if(sweepTo)f.frequency.exponentialRampToValueAtTime(sweepTo,AC.currentTime+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(0,Math.random());s.stop(AC.currentTime+dur+.05);
}
function tone(freq,dur,vol,type){const o=AC.createOscillator();o.type=type||'sine';o.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+dur+.02);}
function sfx(n,pos){
  if(!AC||!save.opt.sound)return;
  let v=1;if(pos){const d=pos.distanceTo(camera.position);v=clamp(1-d/9000,0,1);if(v<.02)return;}
  try{
    if(n==='gun')noiseHit(.06,'highpass',900,.35);
    else if(n==='rocket')noiseHit(.25,'bandpass',900,.4,300);
    else if(n==='missile')noiseHit(.9,'highpass',1800,.4,300);
    else if(n==='boom')noiseHit(1.6,'lowpass',700,.9*v,60);
    else if(n==='hit')tone(160,.12,.4,'square');
    else if(n==='tick')tone(1500,.07,.25);
    else if(n==='beep')tone(880,.12,.25);
    else if(n==='lock')tone(1250,.09,.22);
    else if(n==='warn')tone(1000,.1,.3,'square');
    else if(n==='flare')noiseHit(.5,'highpass',3000,.3);
    else if(n==='cat')noiseHit(1.4,'bandpass',300,.6,2000);
  }catch(e){}
}
function engineSound(){
  if(!AC||!eOsc)return;
  const on=state==='hud'&&player&&save.opt.sound;const t=AC.currentTime;
  const thr=on?player.thr+(player.ab?.3:0):0;
  eGain.gain.setTargetAtTime(on?.12+thr*.12:0,t,.1);eOsc.frequency.setTargetAtTime(55+thr*70+(on?player.speed*.12:0),t,.1);eFilter.frequency.setTargetAtTime(300+thr*900,t,.1);
}

function drawMap(){
  const c=$('#mapc'),x=c.getContext('2d'),S=700/22000,W=700;x.fillStyle='#0b2a44';x.fillRect(0,0,W,W);
  const P=(wx,wz)=>[W/2+wx*S,W/2+wz*S];
  x.fillStyle='#5f8a52';islands.forEach(i=>{const[a,b]=P(i[0],i[1]);x.beginPath();x.arc(a,b,i[2]*S*1.4,0,7);x.fill();});
  for(const id of['blue','red']){const t=T[id];x.fillStyle=id==='blue'?'#4f8fd6':'#e0584c';
    [t.carrier,...t.boats].forEach(s=>{if(!s.alive)return;const[a,b]=P(s.pos.x,s.pos.z);x.fillRect(a-(s.kind==='carrier'?7:4),b-(s.kind==='carrier'?7:4),s.kind==='carrier'?14:8,s.kind==='carrier'?14:8);});}
  planes.forEach(p=>{if(!p.alive)return;const[a,b]=P(p.pos.x,p.pos.z);const f=fwdOf(p);x.save();x.translate(a,b);x.rotate(Math.atan2(f.x,-f.z));x.fillStyle=p.isPlayer?'#fff':(p.team==='blue'?'#7fb5ff':'#ff8a7c');x.beginPath();x.moveTo(0,-7);x.lineTo(5,6);x.lineTo(-5,6);x.fill();x.restore();});
}
/* ---------- per-frame player control ---------- */
function controlPlayer(p,dt){
  if(p.state==='cat'||p.state==='launch'||p.state==='fly'||p.state==='deck'){
    let sx=0,sy=0;
    if(keys.KeyD||keys.ArrowRight)sx+=1;if(keys.KeyA||keys.ArrowLeft)sx-=1;
    if(keys.KeyS||keys.ArrowDown)sy+=1;if(keys.KeyW||keys.ArrowUp)sy-=1;
    let yw=0;if(keys.KeyE)yw+=1;if(keys.KeyQ)yw-=1;
    if(!sx&&!sy){
      if(stick.id!==null){sx=stick.x;sy=-stick.y*(save.opt.invY?-1:1);sy=-sy;}
      else if(save.opt.mouse){const dz=.07;sx=Math.abs(mouse.x)>dz?clamp(mouse.x*1.4,-1,1):0;sy=Math.abs(mouse.y)>dz?clamp(mouse.y*1.4,-1,1):0;}
    }else if(save.opt.invY)sy=-sy;
    // convention: sy>0 = pull (nose up)
    if(stick.id===null&&!save.opt.mouse||!(sx===0&&sy===0)&&stick.id===null&&!save.opt.mouse){}
    p.inp.x=sx;p.inp.y=(keys.KeyS||keys.ArrowDown)?(save.opt.invY?-1:1):((keys.KeyW||keys.ArrowUp)?(save.opt.invY?1:-1):(stick.id!==null?stick.y*(save.opt.invY?-1:1):(save.opt.mouse?-mouse.y*(Math.abs(mouse.y)>.07?1.4:0):0)));
    p.inp.y=clamp(p.inp.y,-1,1);p.inp.yaw=yw;
    if(keys.ShiftLeft||keys.ShiftRight||keys.Equal)thrTarget=Math.min(1,thrTarget+dt*.6);
    if(keys.ControlLeft||keys.ControlRight||keys.Minus)thrTarget=Math.max(0,thrTarget-dt*.6);
    p.thr=thrTarget;p.brk=!!keys.KeyB||p.brk&&$('#bBrk').classList.contains('on');
  }
  const gunOn=keys.Space||hold.gun,wepOn=keys.KeyF||hold.wep;
  if(p.state==='cat'&&(gunOn||wepOn||stick.id!==null&&Math.abs(stick.y)>.5)){p.autoGo=true;thrTarget=1;}
  if(gunOn)fireGun(p);
  if(p.sel===1){if(wepOn){if(p.agType==='rocket')fireRocket(p);else if(p.agType==='bomb')dropBomb(p);}}
  else{
    // lock
    let best=null,ba=.22;
    if(p.state==='fly')for(const q of planes){if(q.team===p.team||!q.alive||q.state!=='fly')continue;tA.copy(q.pos).sub(p.pos);const d=tA.length();if(d>5000)continue;tA.normalize();tB.set(0,0,-1).applyQuaternion(p.q);const a=Math.acos(clamp(tA.dot(tB),-1,1));if(a<ba){ba=a;best=q;}}
    if(best===p.lockT){p.lockTime=(p.lockTime||0)+dt;}else{p.lockT=best;p.lockTime=0;}
    p.locked=best&&p.lockTime>1;
    if(p.locked&&!p.lockSnd){sfx('lock');p.lockSnd=true;}if(!p.locked)p.lockSnd=false;
    if(wepOn&&p.aa>0&&p.cd.wep<=0&&p.state==='fly'){p.cd.wep=2;p.aa--;launchMissile(p,p.locked?best:null,'aa',p.team,tC.set(0,-1.2,-4).applyQuaternion(p.q).add(p.pos));}
  }
}

  let fovT=zoom?30:62;
  if(state==='side'){const c=T[myTeam].carrier;camera.position.set(c.x+Math.cos(orbit)*430,95,c.z+Math.sin(orbit)*430);camera.lookAt(c.x,20,c.z);fovT=55;}
  else if(state==='hangar'&&preview){const L=DEF[save.sel].b.L;const r=L*1.5+9;camera.position.set(preview.position.x+Math.cos(orbit*1.5)*r,preview.position.y+L*.28,preview.position.z+Math.sin(orbit*1.5)*r);camera.lookAt(preview.position.x,preview.position.y+1.5,preview.position.z);fovT=50;}
  else if(player&&player.alive){
    camQ.slerp(player.q,1-Math.exp(-(player.state==='fly'?6:20)*dt));
    tA.set(0,4.6,26+(player.ab?3:0)).applyQuaternion(camQ);camera.position.copy(player.pos).add(tA);
    camera.up.set(0,1,0).applyQuaternion(camQ);tB.set(0,1,-70).applyQuaternion(camQ).add(player.pos);camera.lookAt(tB);
    deathPos.copy(player.pos);
    if(camera.position.y<2)camera.position.y=2;
  }else{camera.position.set(deathPos.x+Math.cos(orbit*3)*80,deathPos.y+30,deathPos.z+Math.sin(orbit*3)*80);camera.up.set(0,1,0);camera.lookAt(deathPos);}
  if(state!=='hud')camera.up.set(0,1,0);
  camFov+=(fovT-camFov)*Math.min(1,dt*6);camera.fov=camFov;camera.updateProjectionMatrix();
  {const fx=player&&player.alive?player.pos:(state==='hangar'&&preview?preview.position:camera.position);sunL.target.position.set(fx.x,fx.y,fx.z);sunL.position.set(fx.x+SUN.x*1200,fx.y+SUN.y*1200,fx.z+SUN.z*1200);}
  waterMat.uniforms.cam.value.copy(camera.position);water.position.set(camera.position.x,0,camera.position.z);sky.position.copy(camera.position);
}
/* ---------- HUD ---------- */
const tgPool=[];function tgEl(i){if(!tgPool[i]){const d=document.createElement('div');d.className='tg';d.innerHTML='<div class="dm"></div><div class="tx"></div>';$('#tgs').appendChild(d);tgPool[i]=d;}return tgPool[i];}
const rctx=$('#radar').getContext('2d');let slotKey='';
function fmtT(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function project(v,out){out.copy(v).project(camera);return out.z<1&&out.z>-1;}
function updateHud(dt){
  $('#tkB').textContent=Math.round(T.blue.tickets);$('#tkR').textContent=Math.round(T.red.tickets);
  $('#clock').textContent=fmtT(match.t);$('#tbB i').style.left=Math.min(94,T.blue.tickets)+'%';$('#tbR i').style.right=Math.min(94,T.red.tickets)+'%';
  const mine=T[myTeam],alive=mine.boats.filter(b=>b.alive).length;
  const p=player;
  $('#obj').textContent=(p&&p.agType?'УДАРНАЯ ГРУППА':'ГРУППА ПВО')+' · ЗАЩИТИТЕ ВАШИ РАКЕТНЫЕ КАТЕРА · ОСТАЛОСЬ '+alive+' · '+fmtT(match.salvo);
  feedItems.forEach(f=>f.t-=dt);if(feedItems.length&&feedItems[0].t<=0){feedItems.shift();renderFeed();}
  $('#dmg').style.opacity=dmgFlash;dmgFlash=Math.max(0,dmgFlash-dt*1.5);$('#hitm').style.opacity=hitFlash;hitFlash=Math.max(0,hitFlash-dt*3);
  if(state==='dead'){$('#big').textContent='Вас сбил: '+deadBy;$('#warn').textContent='';return;}
  if(!p)return;
  $('#big').textContent=p.shield>0&&p.state==='fly'?'Защита при вылете '+Math.ceil(p.shield):'';
  const spdKt=Math.round(p.speed*KT);$('#vspd').textContent=String(spdKt).padStart(3,'0');
  $('#valt').textContent=String(Math.max(0,Math.round(p.pos.y-(p.state==='fly'?0:DECK_Y)))).padStart(5,'0');
  $('#vg').textContent=p.g.toFixed(1)+' G';$('#vm').textContent='M '+(p.speed/340).toFixed(2);
  $('#vaoa').textContent='AOA '+(p.stalled?'18.0':(Math.abs(p.inp.y)*8).toFixed(1));$('#vgear').textContent='Шасси: '+(p.gear?'Вниз':'Вверх')+(p.flaps?' · Закр.':'');
  $('#thrp').textContent=Math.round(p.thr*100)+'%';$('#thrf').style.height=(p.thr*100)+'%';$('#abb').classList.toggle('on',p.ab);
  $('#hpf').style.width=(p.hp/p.maxhp*100)+'%';$('#hpf').style.background=p.hp/p.maxhp<.3?'var(--red)':'var(--green)';
  $('#gunn').textContent=p.ammo;$('#flcnt').textContent=p.flares;
  const wn=p.sel===0?'AIM-9 ('+p.aa+')':(p.agType==='bomb'?'Бомба':(p.agType==='rocket'?'РКТ':'—'));
  $('#wname').textContent=p.sel===0?'Прицеливание':wn;$('#wcnt').textContent=p.sel===0?p.aa:p.ag;
  const k=p.aa+'|'+p.ag+'|'+p.sel+'|'+p.agType;if(k!==slotKey){slotKey=k;
    $('#slots').innerHTML='<div class="slot '+(p.sel===0?'sel':'')+'"><span class="k">AA</span><span class="n">1</span>AIM-9L  x'+p.aa+'</div>'+(p.agType?'<div class="slot ag '+(p.sel===1?'sel':'')+'"><span class="k">AG</span><span class="n">2</span>'+(p.agType==='rocket'?'РКТ':'БОМБА')+'  x'+p.ag+'</div>':'')+'<div class="slot rearm">AUTO REARM</div>';}
  // warnings
  let w='';if(p.stalled&&p.state==='fly')w='СРЫВ! ДАЙТЕ ГАЗ';
  if(p.state==='fly'&&p.pos.y<150&&p.vel.y<-5)w='ВЫСОТА! ВВЕРХ';
  for(const m of missiles){if(m.target===p&&m.pos.distanceTo(p.pos)<4000){w='РАКЕТА!';if(Math.floor(performance.now()/250)%2===0)sfx('warn');break;}}
  $('#warn').textContent=w;
  // targets
  let n=0;
  const showT=(pos,col,text,lock)=>{if(n>=14||!project(pos,tC))return;const el=tgEl(n++);el.style.display='';el.className='tg'+(lock?' lk':'');
    el.firstChild.style.borderColor=col;el.lastChild.style.color=col;el.lastChild.textContent=text;
    el.style.transform='translate('+((tC.x*.5+.5)*innerWidth)+'px,'+((-tC.y*.5+.5)*innerHeight-12)+'px) translate(-50%,0)';};
  for(const q of planes){if(!q.alive||q.team===p.team||q===p)continue;const d=q.pos.distanceTo(p.pos);if(d>7000)continue;
    showT(q.pos,p.lockT===q&&p.locked?'#ff9a3c':'#e0584c',q.pilot.call+' ('+q.pilot.name+') '+(d/1000).toFixed(1)+' км',p.lockT===q&&p.locked);}
  const ec=T[enemyOf(p.team)];
  for(const s of [...ec.boats,ec.carrier]){if(!s.alive)continue;const d=s.pos.distanceTo(p.pos);if(d>9000)continue;showT(s.pos,'#ffb347',(s.kind==='carrier'?'АВИАНОСЕЦ ':'КАТЕР ')+(d/1000).toFixed(1)+' км · '+fmtT(d/Math.max(p.speed,60)));}
  if(p.sel===1&&p.agType==='bomb'&&p.state==='fly'){const t=(p.vel.y+Math.sqrt(p.vel.y*p.vel.y+19.6*Math.max(p.pos.y,1)))/9.8;tA.copy(p.pos).addScaledVector(p.vel,t);tA.y=0;showT(tA,'#ffffff','ПАДЕНИЕ');}
  for(let i=n;i<tgPool.length;i++)tgPool[i].style.display='none';
  drawRadar(p);
  $('#msg').textContent=p.state==='fly'?(p.locked?'ЗАХВАТ ЦЕЛИ':''):msgText;
}
function drawRadar(p){
  const W=260,R=W/2-4,range=10000;rctx.clearRect(0,0,W,W);
  rctx.strokeStyle='#3fb865';rctx.lineWidth=2;rctx.beginPath();rctx.arc(W/2,W/2,R*.5,0,7);rctx.stroke();
  const f=fwdOf(p,tA);const fx=f.x,fz=f.z,l=Math.hypot(fx,fz)||1,nx=fx/l,nz=fz/l;
  const dot=(wx,wz,s,col)=>{const dx=wx-p.pos.x,dz=wz-p.pos.z;let a=(dx*-nz+dz*nx),b=-(dx*nx+dz*nz);const d=Math.hypot(a,b);if(d>range){a*=range/d;b*=range/d;}
    rctx.fillStyle=col;rctx.fillRect(W/2+a/range*R-s/2,W/2+b/range*R-s/2,s,s);};
  for(const id of['blue','red']){const t=T[id],col=id==='blue'?'#5aa8ff':'#ff6a5a';[t.carrier,...t.boats].forEach(s=>{if(s.alive)dot(s.pos.x,s.pos.z,s.kind==='carrier'?14:9,col);});}
  planes.forEach(q=>{if(q.alive&&q!==p)dot(q.pos.x,q.pos.z,7,q.team==='blue'?'#5aa8ff':'#ff6a5a');});
  rctx.fillStyle='#6cff8c';rctx.fillRect(W/2-4,W/2-6,8,12);
}
/* ---------- main loop ---------- */
function step(dt){
  if(!match.over&&!match.training){match.t-=dt;if(match.t<=0){endMatch(T.blue.tickets>=T.red.tickets?'blue':'red');}}
  for(const id of['blue','red'])for(const pl of T[id].pilots){if(pl.isPlayer||pl.plane)continue;pl.rt-=dt;if(pl.rt<=0&&!match.over)spawnBot(pl);}
  for(const p of planes){if(!p.alive)continue;if(p.isPlayer)controlPlayer(p,dt);else botThink(p,dt);updatePlane(p,dt);}
  planes=planes.filter(p=>p.alive);
  updateShips(dt);updateBullets(dt);updateRockets(dt);updateBombs(dt);updateMissiles(dt);updateFlares(dt);
  smokeP.update(dt);fireP.update(dt);
  if(state==='dead'){deadT-=dt;if(deadT<=0)toHangar();}
  if(state==='side'&&Math.floor(performance.now()/1000)!==renderSide.s){renderSide.s=Math.floor(performance.now()/1000);renderSide();}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    step(dt);updateCamera(dt);
    waterMat.uniforms.t.value=now/1000;const px=innerHeight*renderer.getPixelRatio()*.5/Math.tan(camera.fov*Math.PI/360);smokeP.mat.uniforms.px.value=px;fireP.mat.uniforms.px.value=px;
    if(state==='hud'||state==='dead')updateHud(dt);engineSound();
    renderer.render(scene,camera);
  }catch(err){console.error(err);}
}
initWorld();resetMatch();show('side');renderSide();requestAnimationFrame(frame);
</script>
